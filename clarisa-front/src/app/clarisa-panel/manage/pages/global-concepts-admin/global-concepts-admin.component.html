<div class="gc-admin">
  <header class="admin-page">
    <div class="admin-page__head">
      <span class="admin-page__eyebrow">Manage</span>
      <h1 class="admin-page__title">Global Concepts</h1>
      <p class="admin-page__hint">
        The shared vocabulary published by <code>GET api/global-concepts</code>. Every change made on this screen is a direct admin edit and is logged
        as such in the concept history; everyone else proposes changes through requests.
      </p>
    </div>

    <div class="admin-page__aside gc-admin__aside">
      <p-dropdown
        *ngIf="showSchemePicker"
        styleClass="gc-admin__scheme"
        panelStyleClass="admin-dropdown-panel"
        appendTo="body"
        ariaLabel="Concept scheme"
        [options]="schemeOptions"
        [(ngModel)]="scheme">
      </p-dropdown>

      <nav class="admin-tabs" role="tablist" aria-label="Global Concepts sections">
        <button
          type="button"
          role="tab"
          class="admin-tabs__item"
          [class.is-active]="activeSection === 'concepts'"
          [attr.aria-selected]="activeSection === 'concepts'"
          (click)="setSection('concepts')">
          <span>Concepts</span>
        </button>
        <button
          type="button"
          role="tab"
          class="admin-tabs__item"
          [class.is-active]="activeSection === 'requests'"
          [attr.aria-selected]="activeSection === 'requests'"
          (click)="setSection('requests')">
          <span>Requests</span>
        </button>
        <button
          type="button"
          role="tab"
          class="admin-tabs__item"
          [class.is-active]="activeSection === 'import'"
          [attr.aria-selected]="activeSection === 'import'"
          (click)="setSection('import')">
          <span>Import</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <app-gc-concepts-panel
      *ngIf="activeSection === 'concepts'"
      [scheme]="scheme"
      [reloadToken]="conceptsReloadToken"
      [aiEnabled]="aiEnabled"></app-gc-concepts-panel>
    <app-gc-requests-panel *ngIf="activeSection === 'requests'" [scheme]="scheme" [aiEnabled]="aiEnabled"></app-gc-requests-panel>
    <app-gc-import-panel
      *ngIf="activeSection === 'import'"
      [scheme]="scheme"
      [aiEnabled]="aiEnabled"
      (imported)="onImported()"
      (openConcepts)="setSection('concepts')"></app-gc-import-panel>
  </main>
</div>

<p-toast position="top-right"></p-toast>
<p-confirmDialog styleClass="admin-dialog" [breakpoints]="{ '720px': '94vw' }" [style]="{ width: '480px' }"></p-confirmDialog>
