<!--
  Solo se rehízo la maquetación: cada `formControlName`, cada `[(ngModel)]`,
  cada `*ngIf` y el `(ngSubmit)` son exactamente los de antes. Lo que cambió es
  que las anchuras dejaron de escribirse a mano en `style="width: 50%"` —no se
  enteraban de que la pantalla se hacía pequeña—, los campos comparten altura y
  la acción principal dejó de ser un botón naranja «warning» de PrimeNG.
-->
<div class="admin-note">
  <i class="pi pi-info-circle" aria-hidden="true"></i>
  <p>
    Please enter the institution as the legal entity.
    <br />
    The name of the institution should be in its language (e.g. for CIAT).
  </p>
</div>

<form class="admin-form" [formGroup]="group" (ngSubmit)="onSubmit(group.value)">
  <div class="admin-card admin-card--form">
    <div class="admin-form__grid">
      <div class="field admin-form__span">
        <label for="new-institution-name">Name<span class="tag-req">Required</span></label>
        <input id="new-institution-name" type="text" pInputText [required]="true" formControlName="name" />
      </div>

      <div class="field">
        <label>Type<span class="tag-req">Required</span></label>
        <p-dropdown
          [options]="type[0]"
          [(ngModel)]="selectedType"
          optionLabel="name"
          placeholder="Select a type"
          (onChange)="selectType($event.value)"
          [showClear]="true"
          [required]="true"
          formControlName="institutionHelpOne"></p-dropdown>

        <ng-container *ngIf="isArray(subType) && subType.length > 0">
          <label class="field-stack">Subtype<span class="tag-req">Required</span></label>
          <p-dropdown
            [options]="subType"
            [(ngModel)]="selectSubtype"
            optionLabel="name"
            placeholder="Select a subtype"
            (onChange)="selectSubType($event.value)"
            [showClear]="true"
            [required]="true"
            formControlName="institutionHelpTwo"></p-dropdown>
        </ng-container>

        <ng-container *ngIf="isArray(subsType) && subsType.length > 0">
          <label class="field-stack">Subtype<span class="tag-req">Required</span></label>
          <p-dropdown
            [options]="subsType"
            [(ngModel)]="selectSubstype"
            optionLabel="name"
            placeholder="Select a subtype"
            [showClear]="true"
            [required]="true"
            formControlName="institutionTypeCode"></p-dropdown>
        </ng-container>
      </div>

      <div class="field">
        <label>Country<span class="tag-req">Required</span></label>
        <p-dropdown
          [options]="cities[0]"
          [(ngModel)]="selectedCity"
          optionLabel="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          placeholder="Select a country"
          [required]="true"
          formControlName="hqCountryIso">
          <ng-template pTemplate="selectedItem">
            <div class="country-item country-item-value" *ngIf="selectedCity">
              <div>{{ selectedCity.name }}</div>
            </div>
          </ng-template>
          <ng-template let-country pTemplate="item">
            <div class="country-item">
              <div>{{ country.name }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
    </div>

    <div class="admin-form__grid admin-form__grid--wide">
      <div class="field">
        <label for="new-institution-website">Website <span class="tag-opt">Optional</span></label>
        <input id="new-institution-website" type="text" pInputText formControlName="websiteLink" />
      </div>

      <div class="field">
        <label for="new-institution-acronym">Acronym <span class="tag-opt">Optional</span></label>
        <input id="new-institution-acronym" type="text" pInputText formControlName="acronym" />
      </div>
    </div>

    <div class="admin-form__grid">
      <div class="field">
        <label for="new-institution-category-1">Category 1 <span class="tag-opt">Optional</span></label>
        <input id="new-institution-category-1" type="text" pInputText formControlName="category_1" />
      </div>

      <div class="field">
        <label for="new-institution-category-2">Category 2 <span class="tag-opt">Optional</span></label>
        <input id="new-institution-category-2" type="text" pInputText formControlName="category_2" />
      </div>
    </div>

    <div class="field">
      <label for="new-institution-comments">Comments <span class="tag-opt">Optional</span></label>
      <textarea id="new-institution-comments" [rows]="5" pInputTextarea formControlName="externalUserComments"></textarea>
    </div>

    <!-- La acción principal, abajo a la derecha. -->
    <div class="admin-form__actions">
      <p-confirmDialog [style]="{ width: '50vw' }" [baseZIndex]="10000" styleClass="admin-dialog"></p-confirmDialog>
      <button pButton label="Request new institution" class="btn-brand" type="submit"></button>
    </div>
  </div>
</form>

<p-dialog
  header="Missing information"
  [(visible)]="display"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [baseZIndex]="10000"
  [draggable]="false"
  [resizable]="false"
  styleClass="admin-dialog">
  <p>Check that one of the required fields is empty.</p>

  <ng-template pTemplate="footer">
    <button pButton type="button" label="Close" class="btn-ghost" (click)="display = false"></button>
  </ng-template>
</p-dialog>
