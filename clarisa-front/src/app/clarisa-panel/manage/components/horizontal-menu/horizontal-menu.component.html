<!--
  Esta barra ya no lleva el menú público. Home, Dashboards, Services y Help son
  la navegación del sitio, y repetirlas dentro del panel mezclaba lo que puede
  leer cualquiera con lo que solo abre un administrador: quien entra aquí viene
  a administrar, y para volver al sitio está la salida de la derecha
  (Yeck, 16-sep-2026: «no mostrar nada de esto, ya que es para el público»).

  Con el menú fuera se va también el esqueleto Bootstrap 5 que lo sostenía
  —`data-bs-toggle`, el `collapse` y el id `#navbarSupportedContent-4`—: no
  queda nada que plegar, y por debajo de 900px la navegación del panel es la
  fila del sidebar, no una hoja desplegable.

  La marca tampoco vive aquí: la lleva el sidebar, a la izquierda y a la misma
  altura, y las dos piezas comparten el color para leerse como una sola franja.
-->
<div class="app-header header sticky">
  <div class="container-fluid main-container">
    <div class="d-flex cl-bar">
      <!-- La sección en la que estás, tomada de la misma lista que pinta el sidebar. -->
      <h1 class="cl-section">{{ sectionLabel }}</h1>

      <!--
        La vuelta al sitio, arriba y no enterrada al pie de la columna, que era
        donde estaba: un enlace a 700px de altura, tapado por el chat y fuera de
        la pantalla en cuanto la lista crecía, no es una salida.
      -->
      <a class="cl-back" routerLink="/landing-page/home" aria-label="Back to the site">
        <i class="fa fa-arrow-left" aria-hidden="true"></i>
        <span>Back to the site</span>
      </a>

      <a class="cl-logout" routerLink="/landing-page/login" (click)="onLogOut()">Logout</a>
    </div>
  </div>
</div>
