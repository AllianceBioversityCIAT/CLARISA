<div class="gc-admin">
  <header class="admin-page">
    <div class="admin-page__head">
      <span class="admin-page__eyebrow">Manage</span>
      <h1 class="admin-page__title">MELIAF Taxonomy</h1>
      <p class="admin-page__hint">The official CGIAR vocabulary for Monitoring, Evaluation, Learning, Impact Assessment and Foresight: its concepts, change requests and bulk loads.</p>
    </div>

    <div class="admin-page__aside gc-admin__aside">
      <nav class="gc-admin__links" aria-label="Public pages">
        <a class="gc-admin__link" href="/landing-page/global-concepts" target="_blank" rel="noopener" data-link="public"
          ><i class="pi pi-globe" aria-hidden="true"></i>View public page<i class="pi pi-external-link gc-admin__ext" aria-hidden="true"></i
        ></a>
        <a class="gc-admin__link" href="/landing-page/global-concepts/guide" target="_blank" rel="noopener" data-link="guide"
          ><i class="pi pi-book" aria-hidden="true"></i>Guide<i class="pi pi-external-link gc-admin__ext" aria-hidden="true"></i
        ></a>
        <a class="gc-admin__link" href="/landing-page/global-concepts/developers" target="_blank" rel="noopener" data-link="developers"
          ><i class="pi pi-code" aria-hidden="true"></i>Developers<i class="pi pi-external-link gc-admin__ext" aria-hidden="true"></i
        ></a>
        <a class="gc-admin__link" href="/clarisa-panel/documentation/MELIAF_Taxonomy" target="_blank" rel="noopener" data-link="api-docs"
          ><i class="pi pi-file" aria-hidden="true"></i>API docs<i class="pi pi-external-link gc-admin__ext" aria-hidden="true"></i
        ></a>
      </nav>
      <p-dropdown
        *ngIf="showSchemePicker"
        styleClass="gc-admin__scheme"
        panelStyleClass="admin-dropdown-panel"
        appendTo="body"
        ariaLabel="Concept scheme"
        [options]="schemeOptions"
        [(ngModel)]="scheme">
      </p-dropdown>

      <nav class="admin-tabs gc-admin__tabs" role="tablist" aria-label="MELIAF Taxonomy sections">
        <button
          *ngFor="let section of sections"
          type="button"
          role="tab"
          class="admin-tabs__item"
          [class.is-active]="activeSection === section.id"
          [attr.aria-selected]="activeSection === section.id"
          (click)="setSection(section.id)">
          <span>{{ section.label }}</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <app-gc-concepts-panel
      *ngIf="activeSection === 'concepts'"
      [scheme]="scheme"
      [reloadToken]="conceptsReloadToken"
      [createRequest]="createRequest"
      (createHandled)="onCreateHandled($event)"
      [aiEnabled]="aiEnabled"></app-gc-concepts-panel>
    <app-gc-requests-panel *ngIf="activeSection === 'requests'" [scheme]="scheme" [aiEnabled]="aiEnabled"></app-gc-requests-panel>
    <app-gc-import-panel
      *ngIf="activeSection === 'import'"
      [scheme]="scheme"
      [aiEnabled]="aiEnabled"
      (imported)="onImported()"
      (openConcepts)="setSection('concepts')"></app-gc-import-panel>
    <app-gc-setup-panel *ngIf="activeSection === 'setup'" [scheme]="scheme"></app-gc-setup-panel>
    <app-gc-usage-panel *ngIf="activeSection === 'usage'" [scheme]="scheme" (createConcept)="createFromSearch($event)"></app-gc-usage-panel>
  </main>
</div>

<p-toast position="top-right"></p-toast>
<p-confirmDialog styleClass="admin-dialog" [breakpoints]="{ '720px': '94vw' }" [style]="{ width: '480px' }"></p-confirmDialog>
