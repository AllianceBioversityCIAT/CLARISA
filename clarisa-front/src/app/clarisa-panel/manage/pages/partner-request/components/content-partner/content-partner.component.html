<!--
  Esta pantalla vivía dentro de la plantilla de demostración del tema: un
  `page-header` que decía «Tabs», un breadcrumb «Bootstrap / Tabs» y una tarjeta
  con `ul.panel-tabs` dentro de otra tarjeta. Encima arrastraba un margen de
  320px heredado del menú lateral que esta página ya no dibuja, así que el
  contenido empezaba a 600px del borde con la tabla cortada por la derecha.

  Ahora usa el mismo lenguaje que el resto del panel: título + apoyo arriba,
  selector de sección `.admin-tabs` (global) y el contenido debajo, a lo ancho.
-->
<div class="partner-layout">
  <header class="partner-topbar">
    <div class="partner-topbar__head">
      <h2 class="partner-topbar__title">Institution requests</h2>
      <p class="partner-topbar__hint">Look up the institutions already registered in CLARISA, request a new one and resolve the requests waiting for review.</p>
    </div>

    <nav class="admin-tabs" role="tablist" aria-label="Institution request sections">
      <button
        *ngFor="let tab of visibleTabs"
        type="button"
        role="tab"
        class="admin-tabs__item"
        [class.is-active]="activeTab === tab.id"
        [attr.aria-selected]="activeTab === tab.id"
        [attr.aria-controls]="'partner-pane-' + tab.id"
        (click)="activeTab = tab.id">
        <span>{{ tab.label }}</span>
        <!--
          El contador va DENTRO del botón. Antes era un `pBadge` absoluto que
          caía encima de la última palabra de «Pending Institution request(s)».
        -->
        <span class="admin-tabs__count" *ngIf="tab.id === 'pending' && pendingCount">{{ pendingCount }}</span>
      </button>
    </nav>
  </header>

  <!--
    Las cuatro secciones se quedan montadas y solo se oculta la que no toca: la
    lista descarga el catálogo entero de instituciones y los formularios llevan
    lo que el usuario ya escribió. Con `*ngIf` cambiar de pestaña y volver
    costaría la descarga otra vez y borraría el formulario a medias.
  -->
  <main class="partner-main">
    <section id="partner-pane-list" role="tabpanel" [class.is-hidden]="activeTab !== 'list'">
      <app-list-institution></app-list-institution>
    </section>

    <section id="partner-pane-new" role="tabpanel" [class.is-hidden]="activeTab !== 'new'">
      <app-form-new-institution></app-form-new-institution>
    </section>

    <section id="partner-pane-pending" role="tabpanel" [class.is-hidden]="activeTab !== 'pending'">
      <!--
        `?.` en la longitud: mientras la petición está en vuelo —o cuando responde
        401— la propiedad es `undefined` y la plantilla lanzaba un error por cada
        ciclo de detección de cambios.
      -->
      <div class="partner-empty" *ngIf="!pendingCount">
        <i class="fe fe-thumbs-up" aria-hidden="true"></i>
        <div>
          <strong>Nothing pending.</strong>
          <span>There are no institution requests waiting for review.</span>
        </div>
      </div>

      <app-request-institutions-form
        [informationContent]="item"
        [codeContent]="indexList(p, i)"
        *ngFor="let item of informationParnertRequest | paginate: { itemsPerPage: 10, currentPage: p }; let i = index"
        (codePartnerResolver)="partnerResolve($event)"></app-request-institutions-form>

      <div class="partner-pagination" *ngIf="pendingCount > 10">
        <pagination-controls (pageChange)="p = $event" previousLabel="Previous" nextLabel="Next"></pagination-controls>
      </div>
    </section>

    <section id="partner-pane-bulk" role="tabpanel" [class.is-hidden]="activeTab !== 'bulk'">
      <app-partner-bulk></app-partner-bulk>
    </section>
  </main>
</div>

<p-dialog
  header="Process status"
  [(visible)]="statusProcess"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [baseZIndex]="10000"
  [draggable]="false"
  [resizable]="false"
  styleClass="admin-dialog">
  <p>{{ menssageConfirmProcess }}</p>

  <ng-template pTemplate="footer">
    <button pButton type="button" label="Close" class="p-button-text" (click)="statusProcess = false"></button>
  </ng-template>
</p-dialog>
