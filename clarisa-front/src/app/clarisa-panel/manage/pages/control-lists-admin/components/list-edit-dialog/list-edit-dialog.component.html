<p-dialog
  header="Edit list details"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saving"
  [style]="{ width: '36rem' }"
  [breakpoints]="{ '720px': '94vw' }"
  styleClass="admin-dialog">
  <form class="admin-form" (ngSubmit)="submit()" autocomplete="off">
    <div class="field">
      <label for="cl-le-name">Name <span class="tag-req">Required</span></label>
      <input
        id="cl-le-name"
        name="name"
        pInputText
        class="w-full"
        autofocus
        [attr.maxlength]="limits.listName"
        [(ngModel)]="name"
        [disabled]="saving" />
    </div>

    <div class="field">
      <label for="cl-le-desc">Description <span class="tag-opt">Optional</span></label>
      <textarea
        id="cl-le-desc"
        name="description"
        pInputTextarea
        rows="3"
        class="w-full"
        [attr.maxlength]="limits.description"
        [(ngModel)]="description"
        [disabled]="saving"></textarea>
    </div>

    <p class="le-code" *ngIf="list">
      <code class="cl-address">{{ list.code }}</code>
      <span>The code is the public address of the list and cannot be changed.</span>
    </p>

    <p class="field-error cl-error" role="alert" *ngIf="error"><i class="pi pi-times-circle" aria-hidden="true"></i> {{ error }}</p>

    <app-cl-discard-bar *ngIf="confirmingClose" (keep)="keepEditing()" (discard)="discard()"></app-cl-discard-bar>

    <div class="admin-form__actions">
      <button pButton type="button" label="Cancel" class="btn-ghost" [disabled]="saving" (click)="close()"></button>
      <button
        pButton
        type="submit"
        [label]="saving ? 'Saving…' : 'Save changes'"
        class="btn-brand"
        [loading]="saving"
        [disabled]="saving || !valid"></button>
    </div>
  </form>
</p-dialog>
