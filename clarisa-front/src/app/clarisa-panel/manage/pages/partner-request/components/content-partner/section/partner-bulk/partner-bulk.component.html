<!--
  Misma advertencia que en el formulario de al lado: aquí no se tocó ni un
  `formControlName`, ni el `(change)` del archivo, ni el `(ngSubmit)`. Lo que
  cambió es que los dos desplegables y el archivo dejaron de flotar centrados
  sobre una pantalla vacía, el `input[type=file]` de fábrica —con su botón azul
  «Choose File» y su «No file chosen»— pasó a ser una zona de carga propia, y el
  botón lima quedó como el primario del panel.
-->
<form class="admin-form" [formGroup]="group" (ngSubmit)="accepted(group.value)">
  <div class="admin-card admin-card--form">
    <h3 class="admin-card__title">Bulk institution request</h3>
    <p class="admin-card__hint">Upload an Excel file to open several institution requests at once, on behalf of the selected user.</p>

    <div class="admin-form__grid">
      <div class="field">
        <label>Requesting user<span class="tag-req">Required</span></label>
        <p-dropdown
          [options]="users"
          [(ngModel)]="selectedUser"
          optionLabel="email"
          [filter]="true"
          filterBy="email"
          [showClear]="true"
          placeholder="Select a user"
          [required]="true"
          [virtualScroll]="true"
          [itemSize]="31"
          formControlName="externalUser">
          <ng-template pTemplate="selectedItem">
            <div class="country-item country-item-value" *ngIf="selectedUser">
              <div>{{ selectedUser.email }}</div>
            </div>
          </ng-template>
          <ng-template let-country pTemplate="item">
            <div class="country-item">
              <div>{{ country.email }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>

      <div class="field">
        <label>MIS<span class="tag-req">Required</span></label>
        <p-dropdown
          [options]="mises"
          [(ngModel)]="selectedMis"
          optionLabel="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          placeholder="Select a MIS"
          [required]="true"
          [virtualScroll]="true"
          [itemSize]="31"
          formControlName="mis">
          <ng-template pTemplate="selectedItem">
            <div class="country-item country-item-value" *ngIf="selectedMis">
              <div>{{ selectedMis.name }}</div>
            </div>
          </ng-template>
          <ng-template let-country pTemplate="item">
            <div class="country-item">
              <div>{{ country.name }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
    </div>

    <div class="field">
      <label for="file">Excel file<span class="tag-req">Required</span></label>
      <!--
        El `input` sigue siendo el mismo control nativo, con el mismo `accept` y
        el mismo `(change)`: solo se le pone encima una etiqueta que hace de zona
        de carga, porque el botón que pinta el navegador es azul, dice «Choose
        File» y no se puede recolorear.
      -->
      <input
        #bulkFile
        class="bulk-drop__input"
        type="file"
        id="file"
        aria-label="Excel file with the institution requests"
        (change)="basicUploadSingle($any($event.target).files)"
        accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      <label class="bulk-drop" for="file">
        <i class="pi pi-file-excel" aria-hidden="true"></i>
        <span class="bulk-drop__text">
          <!-- El nombre del archivo sale del propio `input`, sin pasar por el
               componente: el `(change)` ya dispara la detección de cambios. -->
          <strong>{{ bulkFile.files?.length ? bulkFile.files[0].name : 'Choose a file' }}</strong>
          <small>{{ bulkFile.files?.length ? 'Click to replace it' : '.xlsx only' }}</small>
        </span>
      </label>
    </div>

    <div class="admin-form__actions">
      <button pButton label="Upload requests" type="submit" class="btn-brand"></button>
    </div>
  </div>
</form>

<p-dialog
  header="Loading partner requests"
  [(visible)]="displayConfirm"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [baseZIndex]="10000"
  [draggable]="false"
  [resizable]="false"
  styleClass="admin-dialog">
  <div class="bulk-loading">
    <img src="../../assets/images/loadeer.gif" alt="" />
    <p>Partners are being updated and institutions are being created.</p>
  </div>
</p-dialog>

<p-toast position="bottom-right" key="br"></p-toast>
