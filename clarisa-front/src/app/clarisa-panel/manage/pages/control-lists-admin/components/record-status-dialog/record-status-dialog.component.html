<p-dialog
  [header]="deactivating ? 'Deactivate record' : 'Reactivate record'"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saving"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '720px': '94vw' }"
  styleClass="admin-dialog">
  <form class="admin-form" (ngSubmit)="submit()" autocomplete="off">
    <p class="cl-lead" *ngIf="record">
      <ng-container *ngIf="deactivating"
        >Record <strong>#{{ record.id }}</strong> leaves the public list but stays readable by its id, so systems that already reference it keep
        working.</ng-container
      >
      <ng-container *ngIf="!deactivating"
        >Record <strong>#{{ record.id }}</strong> goes back to the public list.</ng-container
      >
    </p>

    <div class="field">
      <label for="cl-st-reason">Reason <span class="tag-opt">Optional</span></label>
      <textarea
        id="cl-st-reason"
        name="reason"
        pInputTextarea
        rows="3"
        class="w-full"
        autofocus
        [maxlength]="reasonMax"
        [(ngModel)]="reason"
        [disabled]="saving"></textarea>
      <small class="field-hint">{{ reason.length }}/{{ reasonMax }} · kept with the record's history.</small>
    </div>

    <p class="field-error cl-error" role="alert" *ngIf="error"><i class="pi pi-times-circle" aria-hidden="true"></i> {{ error }}</p>

    <div class="admin-form__actions">
      <button pButton type="button" label="Cancel" class="btn-ghost" [disabled]="saving" (click)="close()"></button>
      <button
        pButton
        type="submit"
        [label]="saving ? 'Saving…' : deactivating ? 'Deactivate' : 'Reactivate'"
        [ngClass]="deactivating ? 'btn-caution-solid' : 'btn-brand'"
        [loading]="saving"
        [disabled]="saving"></button>
    </div>
  </form>
</p-dialog>
