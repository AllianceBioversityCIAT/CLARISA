<!--
  The Bootstrap 3 skeleton is kept on purpose: `data-toggle="collapse"` and
  `data-toggle="dropdown"` are wired by the jQuery bundle loaded globally, so
  renaming or unwrapping these elements would silently kill the mobile menu and
  every submenu. The redesign happens in the stylesheet and in what the brand
  block contains, not in the plumbing.
-->
<header class="wow fadeInDown" data-offset-top="197" data-spy="affix">
  <div class="logo-wrapper">
    <div class="container cl-bar">
      <a class="cl-brand" routerLink="/landing-page/home">
        <!--
          The transparent mark, not `CGIAR_Fondo_verde.png`. The boxed version is
          a white mark on lime, which is 2.43 on its own; the mark over white is
          5.40. See DESIGN.md section 1.
        -->
        <img src="../../../../assets/cgiar_logo.png" alt="CGIAR" class="cl-brand__mark" />
        <span class="cl-brand__word">CLARISA</span>
      </a>

      <nav class="navbar navbar-default cl-nav">
        <div class="navbar-header">
          <button
            type="button"
            class="navbar-toggle collapsed"
            data-toggle="collapse"
            data-target="#bs-example-navbar-collapse-1"
            aria-expanded="false">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
          <ul class="nav navbar-nav">
            <li routerLinkActive="cl-active">
              <a routerLink="/landing-page/home"> Home </a>
            </li>

            <!--
              `routerLinkActive` sits on the <li> so the parent lights up when any
              of the links inside its submenu is the current route. That is what
              makes the soft pill mark the section you are in.
            -->
            <li class="dropdown" routerLinkActive="cl-active">
              <a href="javascript:void(0)" class="dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Dashboards
                <i class="fa fa-caret-down"></i>
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a routerLink="dashboards">Introduction</a>
                </li>

                <li>
                  <a routerLink="institutionsRequestBi"> Institutions request BI </a>
                </li>
              </ul>
            </li>

            <li class="dropdown" routerLinkActive="cl-active">
              <a href="javascript:void(0)" class="dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Services
                <i class="fa fa-caret-down"></i>
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a routerLink="api-services">Introduction</a>
                </li>

                <li>
                  <a routerLink="/clarisa-panel/api-reference">API Reference</a>
                </li>

                <li>
                  <a routerLink="/clarisa-panel/documentation/One_CGIAR_Control_List"> One CGIAR Control List </a>
                </li>

                <li>
                  <a routerLink="/clarisa-panel/documentation/One_CGIAR_Operation"> One CGIAR Operation </a>
                </li>

                <li>
                  <a routerLink="/clarisa-panel/manage/partner-request"> Institution Request </a>
                </li>
              </ul>
            </li>

            <li class="dropdown" routerLinkActive="cl-active">
              <a href="javascript:void(0)" class="dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Help
                <i class="fa fa-caret-down"></i>
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a routerLink="faq">FAQ List</a>
                </li>

                <li>
                  <a routerLink="contact-us"> Contact us</a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </nav>

      <!--
        Outside the collapse on purpose. At >=768px Bootstrap forces
        `.navbar-collapse.collapse { display: block !important }`, so anything
        inside it cannot take part in a flex row and the button dropped to a
        second line. As a direct child of the bar it stays pinned right, and on a
        phone it stays visible next to the burger instead of hiding inside the menu.
      -->
      <a class="cl-signin nav-signin" routerLink="/landing-page/login">Sign in</a>
    </div>
  </div>
</header>
