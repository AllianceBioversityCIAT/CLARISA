<!--
  The four administration modules used to hang from this «Services» dropdown,
  beside the public API documentation. They now live in the panel's left sidebar
  (`app-admin-sidebar`), which is the only place they appear: a menu that mixes
  what anyone can read with what only a signed-in administrator can open teaches
  neither audience where to look.

  The panel theme's Bootstrap 5 skeleton is kept on purpose: `data-bs-toggle`
  and the `#navbarSupportedContent-4` id are what the global bundle wires, so
  renaming or unwrapping them would silently kill the mobile sheet and every
  submenu. The redesign happens in the stylesheet and in what the bar contains,
  never in the plumbing.

  The section icons are gone. The public bar carries none, and on this bar they
  were the last thing still painted lime; the caret stays because it is the only
  one that says something — «this opens».
-->
<div class="app-header header sticky">
  <div class="container-fluid main-container">
    <div class="d-flex cl-bar">
      <!--
        No brand block here on purpose. The sidebar carries it about 70px below
        and at the same x, so both marks stacked read as the logo printed twice
        rather than as one identity. The panel has one brand, and it is the one
        next to the navigation you actually use.
      -->

      <div class="d-flex order-lg-2 ms-auto header-right-icons cl-nav">
        <button
          class="navbar-toggler navresponsive-toggler d-lg-none ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent-4"
          aria-controls="navbarSupportedContent-4"
          aria-expanded="false"
          aria-label="Toggle navigation"
          id="icon-nav-v">
          <span class="navbar-toggler-icon fe fe-more-vertical"></span>
        </button>

        <div class="navbar navbar-collapse responsive-navbar p-0">
          <div class="collapse navbar-collapse" id="navbarSupportedContent-4">
            <div class="d-flex order-lg-2 cl-links">
              <!--
                `routerLinkActive` sits on the wrapper so the parent lights up when
                any link inside its submenu is the current route, which is what
                makes the soft pill mark the section you are in.
              -->
              <div class="d-flex cl-item" routerLinkActive="cl-active">
                <a class="nav-link cl-link" routerLink="/landing-page">Home</a>
              </div>

              <div class="dropdown d-flex cl-item" routerLinkActive="cl-active">
                <a class="nav-link cl-link" href="javascript:void(0)" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Dashboards
                  <i class="fa fa-caret-down"></i>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                  <a class="dropdown-item" href="/landing-page/dashboards" ref="noopener"> Introduction </a>
                  <a class="dropdown-item" routerLink="/landing-page/institutionsRequestBi"> Institutions Request BI </a>
                </div>
              </div>

              <div class="dropdown d-flex cl-item" routerLinkActive="cl-active">
                <a class="nav-link cl-link" href="javascript:void(0)" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Services
                  <i class="fa fa-caret-down"></i>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                  <a class="dropdown-item" routerLink="/landing-page/api-services"> Introduction </a>

                  <a class="dropdown-item" routerLink="/clarisa-panel/api-reference"> API Reference </a>

                  <a class="dropdown-item" routerLink="/clarisa-panel/documentation/One_CGIAR_Control_List"> One CGIAR Control List </a>

                  <a class="dropdown-item" routerLink="/clarisa-panel/documentation/One_CGIAR_Operation"> One CGIAR Operation </a>
                </div>
              </div>

              <div class="dropdown d-flex cl-item" routerLinkActive="cl-active">
                <a class="nav-link cl-link" href="javascript:void(0)" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Help
                  <i class="fa fa-caret-down"></i>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                  <a class="dropdown-item" routerLink="/landing-page/faq"> FAQ </a>

                  <a class="dropdown-item" routerLink="/landing-page/contact-us"> Contact us </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!--
        Outside the collapse on purpose. From 992px the theme forces
        `.responsive-navbar .navbar-collapse { display: flex !important }` and below
        it turns the same box into a fixed sheet, so anything living inside it
        either cannot take part in this row or disappears behind the burger. As a
        direct child of the bar the button stays pinned right at every width.
      -->
      <a class="cl-logout" routerLink="/landing-page/login" (click)="onLogOut()">Logout</a>
    </div>
  </div>
</div>
