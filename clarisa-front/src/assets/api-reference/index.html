  const gi = state.catalog.groups.indexOf(group), ci = group.categories.indexOf(category);
  state.cache.delete(endpoint.route);
  selectEndpoint(gi, ci, endpoint.route);
}

// A tab opened while the rows are still on their way gets the skeleton (or
// the error card), never the previous endpoint's data.
function setTab(t) { state.tab = t; state.picker = null; renderEndpointShell(state.loading, state.loadError); }

/* ── tabs ─────────────────────────────────────────────────────────── */
function renderTab() {
  const zone = $('#exportZone');
  zone.innerHTML = '';
  if (state.tab === 'table') {
    // One primary per zone: Excel is what the analysts come for; the other
    // two formats are outlined.
    zone.innerHTML = `
      <button type="button" onclick="exportExcel()" class="doc-btn doc-btn--primary">${ICON.down}<span>Excel</span></button>
      <button type="button" onclick="exportCSV()" class="doc-btn doc-btn--outline">CSV</button>
      <button type="button" onclick="exportJSON()" class="doc-btn doc-btn--outline">JSON</button>`;
  }
  if (state.tab === 'doc')    return renderDoc();
  if (state.tab === 'table')  return renderTable();
  if (state.tab === 'json')   return renderJSON();
  if (state.tab === 'schema') return renderSchema();
  if (state.tab === 'code')   return renderCode();
}

/* ── column filters ───────────────────────────────────────────────────
   Two kinds, chosen per column by how many distinct values it holds:
     · 'in'       — pick values from a list with counts (types, regions, flags)
     · 'contains' — type a fragment (names, codes, URLs)
   They stack with AND, and the free-text search runs on top of them. Exports
   take `state.filtered`, so a file downloaded after filtering holds exactly
   what the table shows. */
const cellKey = v => (v === null || v === undefined || v === '') ? '' : String(v);
// A Map, not an object: `v in {}` also finds inherited keys, and a cell whose
// value is «toString» would print a function.
const CELL_LABELS = new Map([['', '(empty)'], ['true', 'Yes'], ['false', 'No']]);
const cellLabel = v => (CELL_LABELS.has(v) ? CELL_LABELS.get(v) : v);

function distinctValues(col) {
  if (state.distinct.has(col)) return state.distinct.get(col);
  const counts = new Map();
  for (const r of state.rows) {
    const k = cellKey(r[col]);
    counts.set(k, (counts.get(k) || 0) + 1);
    // Past the limit the column is free text anyway; no need to count it all.
    if (counts.size > PICK_LIMIT + 1) break;
  }
  const list = [...counts.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  state.distinct.set(col, list);
  return list;
}
const isPickable = col => distinctValues(col).length <= PICK_LIMIT;

function rowPasses(r) {
  for (const f of state.filters) {
    const v = cellKey(r[f.col]);
    if (f.mode === 'in') { if (!f.values.includes(v)) return false; }
    else if (!v.toLowerCase().includes(f.text)) return false;
  }
  if (state.search) {
    const q = state.search;
    if (!state.columns.some(c => cellKey(r[c]).toLowerCase().includes(q))) return false;
  }
  return true;
}

function applyFilters() {
  state.filtered = (state.filters.length || state.search) ? state.rows.filter(rowPasses) : state.rows;
  state.page = 1;
  applySort(false);
}

function openPicker(index = -1) {
  const f = index >= 0 ? state.filters[index] : null;
  state.picker = {
    index,
    col: f ? f.col : null,
    q: '', qRaw: '',
    sel: new Set(f && f.mode === 'in' ? f.values : []),
    // 5. The chip shows what was typed; editing it must show the same, not
    // the lower-cased copy used for matching.
    text: f && f.mode === 'contains' ? f.raw : '',
  };
  renderPicker(true);
}
function closePicker() { state.picker = null; const pop = $('#filterPop'); if (pop) pop.remove(); }
function pickerCol(col) { const p = state.picker; p.col = col; p.q = ''; p.qRaw = ''; p.sel = new Set(); p.text = ''; renderPicker(true); }
function pickerBack() { const p = state.picker; p.col = null; p.q = ''; p.qRaw = ''; renderPicker(true); }
function pickerQuery(v) {
  const p = state.picker;
  p.qRaw = v; p.q = v.trim().toLowerCase();
  // Re-rendering replaces the field being typed in; put the caret back.
  renderPicker(false);
  const input = $('#pickerQ');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}
function pickerText(v) { state.picker.text = v; }
function pickerToggle(v) {
  const p = state.picker;
  p.sel.has(v) ? p.sel.delete(v) : p.sel.add(v);
  renderPicker(false);
}
/* The filter the open picker describes, or null when it would filter nothing
   (no value picked, no text typed). */
function buildFilter(p) {
  if (isPickable(p.col)) {
    return p.sel.size ? { col: p.col, mode: 'in', values: [...p.sel] } : null;
  }
  const typed = p.text.trim();
  return typed ? { col: p.col, mode: 'contains', text: typed.toLowerCase(), raw: typed } : null;
}

function pickerApply() {
  const p = state.picker;
  if (!p?.col) return;
  const f = buildFilter(p);
  if (p.index < 0) {
    if (f) state.filters.push(f);
  } else if (f) {
    state.filters[p.index] = f;
  } else {
    state.filters.splice(p.index, 1);
  }
  state.picker = null;
  applyFilters();
  renderTable();
}
function removeFilter(i) { state.filters.splice(i, 1); state.picker = null; applyFilters(); renderTable(); }
function clearFilters() { state.filters = []; state.search = ''; state.picker = null; applyFilters(); renderTable(); }

function pickerHead(p) {
  return `
    <div class="doc-pop__head">
      <button type="button" class="doc-btn doc-btn--ghost doc-btn--sm doc-btn--icon" onclick="pickerBack()" aria-label="Choose another column">${ICON.back}</button>
      <span class="doc-pop__title">${esc(humanizeColumn(p.col))}<small>${esc(p.col)}</small></span>
      <button type="button" class="doc-btn doc-btn--ghost doc-btn--sm doc-btn--icon" onclick="closePicker()" aria-label="Close">${ICON.x}</button>
    </div>`;
}

/* The search box of a list, shown only when the list is long enough to need it. */
function pickerSearch(show, placeholder, value) {
  if (!show) return '';
  return `<div class="doc-field doc-pop__search">${ICON.search}<input id="pickerQ" type="text" placeholder="${placeholder}" value="${esc(value)}" oninput="pickerQuery(this.value)" autocomplete="off"></div>`;
}

const applyLabel = p => (p.index >= 0 ? 'Update' : 'Apply');

// Step 1: which column.
function pickerColumnsHtml(p) {
  const cols = state.columns.filter(c => !p.q || humanizeColumn(c).toLowerCase().includes(p.q) || c.toLowerCase().includes(p.q));
  const items = cols.length
    ? cols.map(c => `
          <button type="button" class="doc-pop__item" data-col="${esc(c)}">
            <span class="doc-pop__label">${esc(humanizeColumn(c))}</span><span class="doc-pop__key">${esc(c)}</span>
          </button>`).join('')
    : '<div class="doc-pop__empty">No column matches.</div>';
  return `
      <div class="doc-pop__head"><span class="doc-pop__title">Filter by column</span>
        <button type="button" class="doc-btn doc-btn--ghost doc-btn--sm doc-btn--icon" onclick="closePicker()" aria-label="Close">${ICON.x}</button></div>
      ${pickerSearch(state.columns.length > 8, 'Find a column…', p.qRaw)}
      <div class="doc-pop__list">${items}</div>`;
}

// Step 2a: pick values. Counts say how much each choice will leave.
function pickerValuesHtml(p) {
  const all = distinctValues(p.col);
  const shown = all.filter(([v]) => !p.q || cellLabel(v).toLowerCase().includes(p.q));
  const items = shown.length
    ? shown.map(([v, n]) => {
        const on = p.sel.has(v);
        return `
          <button type="button" class="doc-pop__item ${on ? 'is-on' : ''}" data-value="${esc(v)}" role="checkbox" aria-checked="${on}">
            <span class="doc-check">${ICON.check}</span><span class="doc-pop__label">${esc(cellLabel(v))}</span><span class="doc-pop__n">${fmt(n)}</span>
          </button>`;
      }).join('')
    : '<div class="doc-pop__empty">No value matches.</div>';
  const status = p.sel.size ? `<b>${p.sel.size}</b> selected` : 'Pick one or more values';
  return `
      ${pickerHead(p)}
      ${pickerSearch(all.length > 8, 'Find a value…', p.qRaw)}
      <div class="doc-pop__list">${items}</div>
      <div class="doc-pop__foot">
        <span class="doc-table__count">${status}</span>
        <button type="button" class="doc-btn doc-btn--primary doc-btn--sm" onclick="pickerApply()">${applyLabel(p)}</button>
      </div>`;
}

// Step 2b: free text for columns with too many values to list.
function pickerTextHtml(p) {
  return `
    ${pickerHead(p)}
    <div class="p-3">
      <div class="doc-field">${ICON.search}<input id="pickerText" type="text" placeholder="Contains…" value="${esc(p.text)}" oninput="pickerText(this.value)" onkeydown="if (event.key === 'Enter') pickerApply()" autocomplete="off"></div>
      <p class="mb-0 mt-2 text-[12px] leading-snug text-ink-3">More than ${PICK_LIMIT} distinct values, so this one is typed — matches any part of the text, case-insensitive.</p>
    </div>
    <div class="doc-pop__foot">
      <span></span>
      <button type="button" class="doc-btn doc-btn--primary doc-btn--sm" onclick="pickerApply()">${applyLabel(p)}</button>
    </div>`;
}

function renderPicker(focus) {
  const p = state.picker;
  let pop = $('#filterPop');
  if (!p) {
    if (pop) pop.remove();
    return;
  }
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'filterPop';
    pop.className = 'doc-pop';
    $('.doc-table__bar')?.appendChild(pop);
  }

  let firstFocus;
  if (!p.col) {
    pop.innerHTML = pickerColumnsHtml(p);
    firstFocus = () => $('#pickerQ');
  } else if (isPickable(p.col)) {
    pop.innerHTML = pickerValuesHtml(p);
    firstFocus = () => $('#pickerQ') || pop.querySelector('.doc-pop__item');
  } else {
    pop.innerHTML = pickerTextHtml(p);
    firstFocus = () => $('#pickerText');
  }
  if (focus) firstFocus()?.focus();
}

// Column and value rows carry their key in a data attribute and are handled
// here, delegated: an inline `onclick='fn("…")'` breaks on the first value
// with an apostrophe (Institution types has «Farmers' association…»).
document.addEventListener('click', e => {
  const pop = e.target.closest('#filterPop');
  if (!pop || !state.picker) return;
  const item = e.target.closest('.doc-pop__item');
  if (!item) return;
  if (item.dataset.col !== undefined) pickerCol(item.dataset.col);
  else if (item.dataset.value !== undefined) pickerToggle(item.dataset.value);
});

// Click outside the popover closes it. The button that opens it is excluded so
// a click there does not close and reopen in one go.
document.addEventListener('mousedown', e => {
  if (!state.picker) return;
  if (e.target.closest('#filterPop') || e.target.closest('[data-filter-opener]')) return;
  closePicker();
});

function chipVerb(f) {
  if (f.mode !== 'in') return 'contains';
  return f.values.length > 1 ? 'is any of' : 'is';
}

function filterChips() {
  return state.filters.map((f, i) => {
    const label = humanizeColumn(f.col);
    let value;
    if (f.mode === 'in') {
      const names = f.values.map(cellLabel);
      const more = names.length > 2 ? ' +' + (names.length - 2) : '';
      value = names.slice(0, 2).join(', ') + more;
    } else value = `“${f.raw}”`;
    return `
      <span class="doc-chip" title="${esc(label)}: ${esc(f.mode === 'in' ? f.values.map(cellLabel).join(', ') : f.raw)}">
        <span class="doc-chip__label" onclick="openPicker(${i})" data-filter-opener><b>${esc(label)}</b> ${chipVerb(f)} ${esc(value)}</span>
        <button type="button" class="doc-chip__x" onclick="removeFilter(${i})" aria-label="Remove this filter">${ICON.x}</button>
      </span>`;
  }).join('');
}

/* ── TABLE tab ────────────────────────────────────────────────────── */
// Two lines on purpose: the readable label for whoever is reading the table,
// and underneath the exact field path, because this page exists so a developer
// can see what the response actually returns. Not a tooltip — a tooltip is
// invisible on touch and impossible to copy.
function headerCell(c) {
  const label = humanizeColumn(c);
  const on = state.sortKey === c;
  let sortState = 'none';
  let arrow = '↕';
  if (on) {
    sortState = state.sortDir > 0 ? 'ascending' : 'descending';
    arrow = state.sortDir > 0 ? '▲' : '▼';
  }
  const key = label.toLowerCase() === String(c).toLowerCase() ? '' : `<span class="th-key">${esc(c)}</span>`;
  return `<th onclick="sortBy(${attr(c)})" class="is-sortable ${on ? 'is-sorted' : ''}" aria-sort="${sortState}">
      <span>${esc(label)}</span><span class="th-sort">${arrow}</span>
      ${key}</th>`;
}

function bodyCell(raw) {
  if (raw === null || raw === undefined || raw === '') return '<td class="is-empty">—</td>';
  if (typeof raw === 'boolean') {
    const tag = raw ? '<span class="doc-tag doc-tag--ok">Yes</span>' : '<span class="doc-tag doc-tag--muted">No</span>';
    return `<td>${tag}</td>`;
  }
  const v = String(raw);
  // Full value, always: a definition is the content here, not a preview of it.
  // Prose wraps into a paragraph capped by the inner div (max-width on a <td>
  // is ignored by the auto table layout, on a block child it is not). Short
  // values keep `whitespace-nowrap` on purpose: if every cell may wrap, an
  // over-wide table collapses to its min-content width and turns ordinary
  // names into one-word-per-line columns. A value carrying markup always takes
  // the wrapping branch: a line break inside `whitespace-nowrap` would render
  // as nothing at all.
  if (v.length > 45 || hasRichMarkup(v)) {
    return `<td class="leading-relaxed"><div class="max-w-[560px] whitespace-normal break-words">${renderRich(v)}</div></td>`;
  }
  return `<td class="whitespace-nowrap">${esc(v)}</td>`;
}

function tableCountHtml(total, hasFilters) {
  if (hasFilters) return `<b>${fmt(total)}</b> of ${fmt(state.rows.length)}`;
  return `<b>${fmt(total)}</b> ${plural(total, 'record')}`;
}

function pageSizeOptions() {
  return PAGE_SIZES
    .filter(n => n !== 'all' || state.rows.length <= AUTO_ALL_LIMIT)
    .map(n => {
      const selected = String(n) === String(state.pageSize) ? 'selected' : '';
      const text = n === 'all' ? 'All' : n;
      return `<option value="${n}" ${selected}>${text}</option>`;
    }).join('');
}

function emptyTableHtml() {
  return `<tr><td colspan="${state.columns.length}" class="px-4 py-14 text-center">
            <div class="text-[14px] font-semibold text-ink">No records match your filters</div>
            <div class="mt-1 text-[12.5px] text-ink-3">Loosen a filter, or clear them all to see the ${fmt(state.rows.length)} records again.</div>
            <button type="button" class="doc-btn doc-btn--outline doc-btn--sm mt-4" onclick="clearFilters()">Clear all filters</button>
          </td></tr>`;
}

function tableFootHtml(total, start, size, pages, showingAll) {
  if (showingAll) return `<span>Showing <b>all ${fmt(total)}</b> ${plural(total, 'record')}</span>`;
  const first = total ? fmt(start + 1) : 0;
  const last = fmt(Math.min(start + size, total));
  return `<span>Showing <b>${first}–${last}</b> of <b>${fmt(total)}</b></span>
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="setPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''} class="doc-btn doc-btn--outline doc-btn--sm">← Prev</button>
          <span class="px-2">Page <b>${fmt(state.page)}</b> / ${fmt(pages)}</span>
          <button type="button" onclick="setPage(${state.page + 1})" ${state.page >= pages ? 'disabled' : ''} class="doc-btn doc-btn--outline doc-btn--sm">Next →</button>
        </div>`;
}

function renderTable() {
  const total = state.filtered.length;
  const showingAll = state.pageSize === 'all';
  const size = showingAll ? Math.max(total, 1) : state.pageSize;
  const pages = Math.max(1, Math.ceil(total / size));
  state.page = Math.min(state.page, pages);
  const start = (state.page - 1) * size;
  const rows = state.filtered.slice(start, start + size);

  const ths = state.columns.map(headerCell).join('');
  const trs = rows.map(r => '<tr>' + state.columns.map(c => bodyCell(r[c])).join('') + '</tr>').join('');

  const hasFilters = state.filters.length > 0 || !!state.search;

  $('#tabBody').innerHTML = `
    <div class="doc-table">
      <div class="doc-table__bar">
        <div class="doc-field w-full sm:w-[260px]">
          ${ICON.search}
          <input id="tableSearch" type="text" placeholder="Search ${fmt(state.rows.length)} records…" value="${esc(state.search)}" autocomplete="off" aria-label="Search every column">
        </div>
        <div class="doc-filters" id="filterZone">
          ${filterChips()}
          <button type="button" class="doc-btn doc-btn--outline doc-btn--sm" onclick="openPicker()" data-filter-opener>${ICON.filter}<span>${state.filters.length ? 'Add filter' : 'Filter'}</span></button>
          ${hasFilters ? `<button type="button" class="doc-btn doc-btn--ghost doc-btn--sm" onclick="clearFilters()">Clear all</button>` : ''}
        </div>
        <div class="ml-auto flex items-center gap-3">
          <span class="doc-table__count">${tableCountHtml(total, hasFilters)}</span>
          <label class="flex items-center gap-2 text-[12.5px] text-ink-3">Rows
            <span class="doc-select doc-select--sm"><select id="pageSize" aria-label="Rows per page">
              ${pageSizeOptions()}
            </select></span>
          </label>
        </div>
      </div>
      <div class="doc-table__scroll">
        <table class="data doc-grid"><thead><tr>${ths}</tr></thead><tbody>${trs || emptyTableHtml()}</tbody></table>
      </div>
      <div class="doc-table__foot">
        ${tableFootHtml(total, start, size, pages, showingAll)}
      </div>
    </div>`;

  let deb;
  $('#tableSearch').addEventListener('input', e => {
    clearTimeout(deb);
    deb = setTimeout(() => {
      state.search = e.target.value.trim().toLowerCase();
      applyFilters();
      renderTable();
      const inp = $('#tableSearch'); inp.value = e.target.value; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }, 250);
  });
  $('#pageSize').addEventListener('change', e => { state.pageSize = e.target.value === 'all' ? 'all' : +e.target.value; state.page = 1; renderTable(); });
  if (state.picker) renderPicker(false);
}

function setPage(p) { state.page = p; renderTable(); }

function sortBy(col) {
  if (state.sortKey === col) state.sortDir *= -1; else { state.sortKey = col; state.sortDir = 1; }
  applySort(true);
}
function applySort(rerender) {
  if (state.sortKey) {
    const k = state.sortKey, d = state.sortDir;
    state.filtered = [...state.filtered].sort((a, b) => {
      const x = a[k], y = b[k];
      if (x == null) return 1; if (y == null) return -1;
      const nx = parseFloat(x), ny = parseFloat(y);
      if (!isNaN(nx) && !isNaN(ny) && String(nx) == String(x).trim() && String(ny) == String(y).trim()) return (nx - ny) * d;
      return String(x).localeCompare(String(y)) * d;
    });
  }
  if (rerender) renderTable();
}

/* ── query params ─────────────────────────────────────────────────────
   The filters an endpoint accepts, read from the OpenAPI spec and shared by
   the Doc tab (which documents them) and the JSON tab (which runs them).
   `version` is not published as a parameter by Nest, so it is appended for the
   endpoints that do serve a v2. */
function queryParamsFor(route) {
  const op = specOpFor(route);
  const params = (op?.parameters || []).filter(p => p.in === 'query').map(p => {
    const schema = p.schema || {};
    return {
      name: p.name,
      required: !!p.required,
      description: p.description || '',
      values: Array.isArray(schema.enum) ? schema.enum : null,
      type: tsType(schema),
      isNumber: schema.type === 'number' || schema.type === 'integer',
      default: schema.default !== undefined ? String(schema.default) : '',
    };
  });

  const baseRoute = route.replace(/^api\//, '').replace(/^\/+/, '');
  if (V2_ENDPOINTS[baseRoute] && !params.some(p => p.name === 'version')) {
    params.push({
      name: 'version',
      required: false,
      description: 'Response version. Omit it and you get v1.',
      values: ['1', '2'],
      type: '"1" | "2"',
      isNumber: false,
      default: '1',
    });
  }
  return params;
}

/** The filters currently filled in, as `name=value` pairs. */
function activeQueryPairs() {
  return Object.entries(state.query).filter(([, v]) => v !== '' && v !== null && v !== undefined);
}

function buildQueryUrl() {
  const pairs = activeQueryPairs();
  const qs = pairs.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
  return API_BASE + state.current.endpoint.route + (qs ? '?' + qs : '');
}

/* Updates the state and only repaints the URL preview: repainting the whole
   panel on every keystroke would steal the focus from the field being typed. */
function setQueryValue(name, value) {
  if (value === '' || value === null) delete state.query[name];
  else state.query[name] = value;

  const preview = $('#queryUrl');
  if (preview) preview.textContent = buildQueryUrl();
  const runBtn = $('#queryRun');
  if (runBtn) runBtn.disabled = false;
}

async function runQuery() {
  const url = buildQueryUrl();
  state.queryLoading = true; state.queryError = null;
  renderJSON();
  try {
    const data = await fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    state.queryResult = { url, data };
  } catch (e) {
    state.queryResult = null;
    state.queryError = String(e);
  }
  state.queryLoading = false;
  renderJSON();
}

function resetQuery() {
  state.query = {}; state.queryResult = null; state.queryError = null;
  renderJSON();
}

/** What the JSON tab is showing: the filtered response when one was run, the
    plain endpoint response otherwise. */
function currentJsonData() {
  return state.queryResult ? state.queryResult.data : state.cache.get(state.current.endpoint.route);
}

/* ── JSON tab ─────────────────────────────────────────────────────── */
function queryEnumField(p, value) {
  const defaultNote = p.default ? ' (' + esc(p.default) + ')' : '';
  const options = p.values.map(v => {
    const selected = String(value) === String(v) ? ' selected' : '';
    return `<option value="${esc(v)}"${selected}>${esc(v)}</option>`;
  }).join('');
  return `<span class="doc-select w-full"><select class="w-full" onchange="setQueryValue(${attr(p.name)}, this.value)" style="font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500">
           <option value=""${value === '' ? ' selected' : ''}>— not sent${defaultNote} —</option>
           ${options}
         </select></span>`;
}

function queryTextField(p, value) {
  return `<div class="doc-field doc-field--mono"><input type="${p.isNumber ? 'number' : 'text'}" value="${esc(value)}"
           oninput="setQueryValue(${attr(p.name)}, this.value)"
           onkeydown="if (event.key === 'Enter') runQuery()"
           placeholder="${p.default ? esc(p.default) : 'not sent'}"></div>`;
}

function renderJSON() {
  const params = queryParamsFor(state.current.endpoint.route);
  const raw = currentJsonData();
  const arr = Array.isArray(raw) ? raw : [raw];
  const preview = arr.slice(0, 50);
  const filtered = !!state.queryResult;

  $('#exportZone').innerHTML = `<button type="button" onclick="exportJSON()" class="doc-btn doc-btn--primary">${ICON.down}<span>Download full JSON</span></button>`;

  const controls = params.map(p => {
    const value = state.query[p.name] ?? '';
    const field = p.values ? queryEnumField(p, value) : queryTextField(p, value);
    return `
      <div>
        <label class="mb-1.5 flex items-center gap-2 font-mono text-[12px] font-semibold text-brand-800">${esc(p.name)}${p.required ? '<span class="doc-tag doc-tag--error">required</span>' : ''}</label>
        ${field}
        ${p.description ? `<p class="mb-0 mt-1.5 text-[11.5px] leading-snug text-ink-3">${esc(p.description)}</p>` : ''}
      </div>`;
  }).join('');

  let panel = '';
  if (params.length) {
    const runAttrs = state.queryLoading ? 'disabled' : '';
    const runLabel = state.queryLoading ? 'Running…' : 'Run query';
    const showReset = filtered || activeQueryPairs().length > 0;
    const resetBtn = showReset ? '<button type="button" onclick="resetQuery()" class="doc-btn doc-btn--outline">Reset</button>' : '';
    const errorBox = state.queryError
      ? '<div class="mt-3 rounded-lg border border-[#f4c7c3] bg-[#fdeceb] px-3 py-2 font-mono text-xs text-[#8f1d15]">' + esc(state.queryError) + '</div>'
      : '';
    panel = `
    <div class="doc-card mb-4 p-5">
      <div class="mb-3 flex flex-wrap items-baseline justify-between gap-2">
        <h3 class="m-0 text-[14px] font-bold text-forest">Try it with query parameters</h3>
        <span class="text-[12px] text-ink-3">Leave a field empty to omit it — no filters means the default response.</span>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${controls}</div>
      <div class="mt-4 flex flex-wrap items-center gap-2 rounded-lg border border-line bg-surface-2 px-3 py-2">
        <span class="doc-method">GET</span>
        <code id="queryUrl" class="min-w-0 flex-1 break-all font-mono text-[12.5px] text-ink">${esc(buildQueryUrl())}</code>
        <button type="button" onclick="copyText($('#queryUrl').textContent, this)" class="doc-btn doc-btn--outline doc-btn--sm doc-btn--icon" aria-label="Copy the URL">${ICON.copy}</button>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <button type="button" id="queryRun" onclick="runQuery()" ${runAttrs} class="doc-btn doc-btn--primary">${ICON.play}<span>${runLabel}</span></button>
        ${resetBtn}
      </div>
      ${errorBox}
    </div>`;
  }

  const label = filtered
    ? `Filtered response · ${esc(state.queryResult.url.split('?')[1] || 'no filters')} · first ${fmt(preview.length)} of ${fmt(arr.length)}`
    : `Live response · first ${fmt(preview.length)} of ${fmt(arr.length)} items`;

  $('#tabBody').innerHTML = `
    ${panel}
    <div class="doc-code">
      <div class="doc-code__bar">
        <span class="doc-code__title">${label}</span>
        <button type="button" onclick="copyText(jsonPreviewText(), this)" class="doc-btn doc-btn--sm doc-btn--dark">${ICON.copy}<span>Copy</span></button>
      </div>
      <pre class="doc-code__pre doc-code__pre--tall"><code>${esc(JSON.stringify(preview, null, 2))}</code></pre>
    </div>`;
}
function jsonPreviewText() {
  const raw = currentJsonData();
  const arr = Array.isArray(raw) ? raw : [raw];
  return JSON.stringify(arr.slice(0, 50), null, 2);
}

/* ── SCHEMA tab ───────────────────────────────────────────────────── */
function resolveRef(node) {
  if (node?.$ref) {
    const name = node.$ref.split('/').pop();
    return state.spec?.components?.schemas?.[name] || {};
  }
  return node || {};
}
function renderSchema() {
  const op = specOpFor(state.current.endpoint.route);
  let schema = op?.responses?.['200']?.content?.['application/json']?.schema;
  schema = resolveRef(schema);
  if (schema.type === 'array') schema = resolveRef(schema.items);
  const props = schema.properties;

  if (!props) {
    const sample = state.rows[0] || {};
    $('#tabBody').innerHTML = schemaTable(Object.keys(sample).map(k => [k, { type: typeof sample[k] }]), true);
    return;
  }
  const required = new Set(schema.required || []);
  $('#tabBody').innerHTML = schemaTable(Object.entries(props).map(([k, v]) => [k, resolveRef(v), required.has(k)]), false);
}
function schemaTable(entries, inferred) {
  const rows = entries.map(([name, def, req]) => `
    <tr>
      <td class="is-mono font-semibold text-brand-800">${esc(name)} ${req ? '<span class="doc-tag doc-tag--error ml-1">required</span>' : ''}</td>
      <td><span class="doc-tag doc-tag--muted doc-tag--mono">${esc(def.type || 'object')}${def.format ? ` · ${esc(def.format)}` : ''}</span></td>
      <td>${esc(def.description || '') || '<span class="text-ink-3">—</span>'}</td>
    </tr>`).join('');
  return `
    ${inferred ? `<div class="mb-3">${note('Schema not published in the OpenAPI spec — fields inferred from live data.', 'doc-note--warn')}</div>` : ''}
    ${proseTable(['Field', 'Type', 'Description'], rows)}`;
}

/* ── CODE tab ─────────────────────────────────────────────────────── */
function renderCode() {
  const url = API_BASE + state.current.endpoint.route;
  const blocks = [
    ['cURL', `curl -X GET "${url}" \\\n  -H "Accept: application/json"`],
    ['JavaScript (fetch)', `const res = await fetch("${url}");\nconst data = await res.json();\nconsole.log(data);`],
    ['Python (requests)', `import requests\n\nres = requests.get("${url}")\ndata = res.json()\nprint(len(data), "records")`],
  ];
  $('#tabBody').innerHTML = `<div class="mx-auto max-w-4xl">${blocks.map(([title, code]) => docCodeBlock(title, code)).join('')}</div>`;
}

/* ── DOC tab ──────────────────────────────────────────────────────── */
/* Endpoints that expose a v2 via the ?version=2 query param (the rest serve v1).
   Mirrors the @Version(...) decorators in the NestJS controllers. */
const V2_ENDPOINTS = {
  'cgiar-entities':        'Returns the richer <code class="docpill">CgiarEntityDtoV2</code> shape (entity type, lineages, portfolio, dates) and adds the <code class="docpill">portfolioId</code> and <code class="docpill">year</code> filters.',
  'cgiar-entity-typology': 'Returns the v2 typology shape.',
  'sdgs':                  'Declared <code class="docpill">@Version([\'1\',\'2\'])</code> — responds identically for v1 and v2.',
  'sdg-targets':           'Returns the v2 target shape.',
  'sdg-indicators':        'Returns the v2 indicator shape.',
};

function tsType(node) {
  if (!node) return 'any';
  if (node.$ref) return node.$ref.split('/').pop();
  if (node.type === 'array') {
    const it = node.items || {};
    const inner = it.$ref ? it.$ref.split('/').pop() : tsType(it);
    return inner + '[]';
  }
  if (Array.isArray(node.enum)) return node.enum.map(e => JSON.stringify(e)).join(' | ');
  const t = node.type;
  if (t === 'integer' || t === 'number') return 'number';
  if (t === 'boolean') return 'boolean';
  if (t === 'string') return 'string';
  if (t === 'object') return 'object';
  return t || 'any';
}

function docSection(title, subtitle, bodyHtml) {
  return `
    <section class="mb-7">
      <h2 class="m-0 text-[17px] font-bold text-forest">${title}</h2>
      ${subtitle ? `<p class="mb-3 mt-1 text-[13.5px] leading-relaxed text-ink-2">${subtitle}</p>` : '<div class="mb-3"></div>'}
      ${bodyHtml}
    </section>`;
}

function renderDoc() {
  const route = state.current.endpoint.route;            // e.g. "api/cgiar-entities"
  const baseRoute = route.replace(/^api\//, '').replace(/^\/+/, '');
  const url = API_BASE + route;
  const op = specOpFor(route);

  /* ── 1. Versioning ── */
  const v2 = V2_ENDPOINTS[baseRoute];
  let versioningBody;
  if (v2) {
    const vEx = `# v1 — default, no param needed\nGET ${url}\n\n# v2 — opt in with the version query param\nGET ${url}?version=2`;
    versioningBody = `
      <div class="mb-4 grid gap-3 sm:grid-cols-2">
        <div class="doc-card p-4">
          <div class="flex items-center gap-2"><span class="doc-tag doc-tag--muted doc-tag--mono">v1</span><span class="text-[12px] font-semibold text-ink-3">default</span></div>
          <p class="mb-0 mt-2 text-[13.5px] leading-relaxed text-ink-2">Served when no <code class="docpill">version</code> param is sent.</p>
        </div>
        <div class="rounded-card border border-brand-200 bg-brand-50 p-4">
          <div class="flex items-center gap-2"><span class="doc-tag doc-tag--mono" style="background:var(--brand-strong);color:#fff">v2</span><span class="text-[12px] font-semibold text-brand-800">opt-in</span></div>
          <p class="mb-0 mt-2 text-[13.5px] leading-relaxed text-brand-800">${v2}</p>
        </div>
      </div>
      ${docCodeBlock('Selecting a version', vEx)}`;
  } else {
    versioningBody = `
      <div class="rounded-control border border-line bg-surface-2 p-4">
        <div class="flex items-center gap-2"><span class="doc-tag doc-tag--muted doc-tag--mono">v1</span><span class="text-[12px] font-semibold text-ink-3">only</span></div>
        <p class="mb-0 mt-2 text-[13.5px] leading-relaxed text-ink-2">
          This endpoint has a single version. Sending <code class="docpill">?version=2</code> has no effect — it always serves its v1 response.
        </p>
      </div>`;
  }
  const versioning = docSection(
    'Versioning',
    `CLARISA versions the API through an optional <code class="docpill">?version=N</code> query param — not via the URI and not via a header. Omit it and you get <b class="font-semibold text-ink">v1</b>.`,
    versioningBody,
  );

  /* ── 2. Query params ── */
  const qParams = queryParamsFor(route);
  let paramsBody;
  if (qParams.length) {
    const rows = qParams.map(p => {
      const values = p.values
        ? `<div class="mt-1.5 flex flex-wrap gap-1">${p.values.map(v => `<code class="docpill">${esc(v)}</code>`).join('')}</div>`
        : '';
      return `
        <tr>
          <td class="is-mono font-semibold text-brand-800">${esc(p.name)}
            <div class="mt-1.5">${p.required ? '<span class="doc-tag doc-tag--error">required</span>' : '<span class="doc-tag doc-tag--muted">optional</span>'}</div></td>
          <td><span class="doc-tag doc-tag--muted doc-tag--mono">${esc(p.values ? 'enum' : p.type)}</span>${values}</td>
          <td class="is-mono">${p.default ? esc(p.default) : '<span class="text-ink-3">—</span>'}</td>
          <td>${esc(p.description) || '<span class="text-ink-3">Not documented in the spec.</span>'}</td>
        </tr>`;
    }).join('');

    /* One ready-made request per value of every enum filter — the answer to
       "how do I get only the active ones?" should be a line you can copy, not
       a table you have to interpret. */
    const recipes = [];
    qParams.filter(p => p.values).forEach(p => {
      p.values.forEach(v => recipes.push(`# ${p.name} = ${v}\nGET ${url}?${p.name}=${v}`));
    });
    /* Only enums go into the combined example: their values are real, while
       inventing a number for a cursor teaches the wrong thing. */
    const combo = qParams.filter(p => p.values).slice(0, 2)
      .map(p => `${p.name}=${p.values[p.values.length - 1]}`);
    if (combo.length > 1) recipes.push(`# combined — filters stack with &\nGET ${url}?${combo.join('&')}`);
    if (!recipes.length) recipes.push(`# every parameter is optional\nGET ${url}`);

    paramsBody = `
      <div class="mb-4">${note(`Every filter below is <b>optional unless marked required</b>. Send none and the endpoint replies exactly as it always has —
        adding a filter never changes the shape of the response, only which records come back.`)}</div>
      ${proseTable(['Param', 'Type · accepted values', 'Default', 'Description'], rows)}
      <p class="mb-3 mt-4 text-[13.5px] text-ink-2">Copy any of these, or build your own in the <b class="font-semibold text-ink">JSON</b> tab and run it against the live API.</p>
      ${docCodeBlock('Ready-made requests', recipes.join('\n\n'))}`;
  } else {
    const v2Hint = v2 ? ' You can still pass <code class="docpill">?version=2</code> to opt into v2.' : '';
    const example = v2 ? '<div class="mt-4">' + docCodeBlock('Example', 'GET ' + url + '?version=2') + '</div>' : '';
    paramsBody = `
      <div class="rounded-control border border-line bg-surface-2 p-4 text-[13.5px] leading-relaxed text-ink-2">
        No query parameters are published for this endpoint in the OpenAPI spec.${v2Hint}
      </div>${example}`;
  }
  const params = docSection('Query parameters', 'Optional filters you append to the request URL to narrow what comes back.', paramsBody);

  /* ── 3. Responses / status codes ── */
  const responses = op?.responses || {};
  const respKeys = Object.keys(responses);
  const statusRow = (code, text) => {
    const ok = String(code).startsWith('2');
    return `<tr>
      <td><span class="doc-tag doc-tag--mono ${ok ? 'doc-tag--ok' : 'doc-tag--warn'}">${esc(code)}</span></td>
      <td>${esc(text)}</td>
    </tr>`;
  };
  const respRows = respKeys.length
    ? respKeys.map(code => statusRow(code, responses[code].description || (String(code).startsWith('2') ? 'Successful response' : ''))).join('')
    : statusRow('200', 'Successful response — returns the control list.') + statusRow('401', 'Missing or invalid API token.');
  const respSection = docSection('Responses', 'HTTP status codes this endpoint can return.', proseTable(['Status', 'Meaning'], respRows));

  /* ── 4. Response model / DTO interface ── */
  let schemaNode = op?.responses?.['200']?.content?.['application/json']?.schema;
  let returnsArray = false;
  if (schemaNode?.type === 'array') { returnsArray = true; schemaNode = schemaNode.items; }
  const modelName = schemaNode?.$ref ? schemaNode.$ref.split('/').pop() : (resolveRef(schemaNode).title || 'Response');
  const model = resolveRef(schemaNode);
  const props = model.properties;
  let dtoBody;
  if (props) {
    const required = new Set(model.required || []);
    const lines = Object.entries(props).map(([k, v]) => {
      const optional = required.has(k) ? '' : '?';
      const t = tsType(v);
      const desc = (resolveRef(v).description || v.description || '').replace(/\s+/g, ' ').trim();
      return `  ${k}${optional}: ${t};${desc ? '  // ' + desc : ''}`;
    });
    const iface = `interface ${modelName} {\n${lines.join('\n')}\n}`;
    const returnLine = `// GET ${route} → ${returnsArray ? modelName + '[]' : modelName}`;
    dtoBody = docCodeBlock(`${modelName}${returnsArray ? '[]' : ''}`, `${returnLine}\n\n${iface}`);
  } else {
    const sample = state.rows && state.rows[0];
    if (sample) {
      const lines = Object.keys(sample).map(k => `  ${k}: ${tsTypeOf(sample[k])};`);
      const shape = 'interface ' + modelName + ' {\n' + lines.join('\n') + '\n}';
      dtoBody = `<div class="mb-3">${note('Model not published in the OpenAPI spec — shape inferred from live data.', 'doc-note--warn')}</div>${docCodeBlock('Inferred shape', shape)}`;
    } else {
      dtoBody = `<div class="rounded-control border border-line bg-surface-2 p-4 text-[13.5px] text-ink-2">No response model published for this endpoint.</div>`;
    }
  }
  const dtoSection = docSection('Response model', 'The DTO returned in the response body.', dtoBody);

  $('#tabBody').innerHTML = `<div class="mx-auto max-w-4xl">${versioning}${params}${respSection}${dtoSection}</div>`;
}

/* ── exports ──────────────────────────────────────────────────────── */
function exportName(ext) {
  const d = new Date().toISOString().slice(0, 10);
  return `CLARISA_${state.current.endpoint.name.replace(/\s+/g, '_')}_${d}.${ext}`;
}
// Exports carry the visible columns, keyed by the raw field path: a hidden
// column is noise in the file too, but a renamed header would break whatever
// script already reads it. And they carry the FILTERED rows: a file downloaded
// after narrowing the table holds exactly what the table shows.
function exportRows() {
  return state.filtered.map(r => Object.fromEntries(state.columns.map(c => [c, r[c]])));
}
function exportExcel() {
  const ws = XLSX.utils.json_to_sheet(exportRows());
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'data');
  XLSX.writeFile(wb, exportName('xlsx'));
}
function exportCSV() {
  const ws = XLSX.utils.json_to_sheet(exportRows());
  download(new Blob(['﻿' + XLSX.utils.sheet_to_csv(ws)], { type: 'text/csv;charset=utf-8' }), exportName('csv'));
}
function exportJSON() {
  // From the JSON tab you download what you are looking at, query included;
  // from the Table tab, the rows the table shows (filters included).
  const raw = state.tab === 'json' ? currentJsonData() : exportRows();
  download(new Blob([JSON.stringify(raw, null, 2)], { type: 'application/json' }), exportName('json'));
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ── misc ─────────────────────────────────────────────────────────── */
function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(() => {
    const label = btn.querySelector('span');
    const target = label || btn;
    const old = target.innerHTML;
    target.innerHTML = label ? 'Copied' : ICON.check;
    btn.classList.add('is-copied');
    setTimeout(() => { target.innerHTML = old; btn.classList.remove('is-copied'); }, 1400);
  });
}
</script>
</body>
