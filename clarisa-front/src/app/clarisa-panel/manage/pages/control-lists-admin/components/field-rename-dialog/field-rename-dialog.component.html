<p-dialog
  header="Rename field"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saving"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '720px': '94vw' }"
  styleClass="admin-dialog">
  <form class="admin-form" (ngSubmit)="submit()" autocomplete="off">
    <div class="field">
      <label for="cl-fr-label">Label <span class="tag-req">Required</span></label>
      <input
        id="cl-fr-label"
        name="label"
        pInputText
        class="w-full"
        autofocus
        [attr.maxlength]="limits.fieldLabel"
        [(ngModel)]="label"
        [disabled]="saving" />
    </div>
    <div class="field">
      <label for="cl-fr-code">Code <span class="tag-req">Required</span></label>
      <input
        id="cl-fr-code"
        name="code"
        pInputText
        class="w-full cl-mono"
        [attr.maxlength]="limits.code"
        [attr.aria-invalid]="codeInvalid"
        [(ngModel)]="code"
        [disabled]="saving" />
      <small class="field-error" role="alert" *ngIf="codeInvalid">{{ codeError }}</small>
    </div>

    <p class="admin-note cl-note cl-note--warn" *ngIf="published && codeChanged">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span
        >This list is published. Changing the code changes the field name in its public address, so systems that read it will see the new name.</span
      >
    </p>

    <p class="field-error cl-error" role="alert" *ngIf="error"><i class="pi pi-times-circle" aria-hidden="true"></i> {{ error }}</p>

    <app-cl-discard-bar *ngIf="confirmingClose" (keep)="keepEditing()" (discard)="discard()"></app-cl-discard-bar>

    <div class="admin-form__actions">
      <button pButton type="button" label="Cancel" class="btn-ghost" [disabled]="saving" (click)="close()"></button>
      <button pButton type="submit" [label]="saving ? 'Saving…' : 'Save'" class="btn-brand" [loading]="saving" [disabled]="saving || !valid"></button>
    </div>
  </form>
</p-dialog>
