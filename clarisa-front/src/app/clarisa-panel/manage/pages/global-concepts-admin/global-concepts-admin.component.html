<div class="gc-admin">
  <header class="admin-page">
    <div class="admin-page__head">
      <span class="admin-page__eyebrow">Manage</span>
      <h1 class="admin-page__title">Global Concepts</h1>
      <p class="admin-page__hint">The shared vocabulary published by <code>GET api/global-concepts</code>, its change requests and its bulk loads.</p>
    </div>

    <div class="admin-page__aside gc-admin__aside">
      <p-dropdown
        *ngIf="showSchemePicker"
        styleClass="gc-admin__scheme"
        panelStyleClass="admin-dropdown-panel"
        appendTo="body"
        ariaLabel="Concept scheme"
        [options]="schemeOptions"
        [(ngModel)]="scheme">
      </p-dropdown>

      <nav class="admin-tabs gc-admin__tabs" role="tablist" aria-label="Global Concepts sections">
        <button
          *ngFor="let section of sections"
          type="button"
          role="tab"
          class="admin-tabs__item"
          [class.is-active]="activeSection === section.id"
          [attr.aria-selected]="activeSection === section.id"
          (click)="setSection(section.id)">
          <span>{{ section.label }}</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <app-gc-concepts-panel
      *ngIf="activeSection === 'concepts'"
      [scheme]="scheme"
      [reloadToken]="conceptsReloadToken"
      [createRequest]="createRequest"
      (createHandled)="onCreateHandled($event)"
      [aiEnabled]="aiEnabled"></app-gc-concepts-panel>
    <app-gc-requests-panel *ngIf="activeSection === 'requests'" [scheme]="scheme" [aiEnabled]="aiEnabled"></app-gc-requests-panel>
    <app-gc-import-panel
      *ngIf="activeSection === 'import'"
      [scheme]="scheme"
      [aiEnabled]="aiEnabled"
      (imported)="onImported()"
      (openConcepts)="setSection('concepts')"></app-gc-import-panel>
    <app-gc-setup-panel *ngIf="activeSection === 'setup'" [scheme]="scheme"></app-gc-setup-panel>
    <app-gc-usage-panel *ngIf="activeSection === 'usage'" [scheme]="scheme" (createConcept)="createFromSearch($event)"></app-gc-usage-panel>
  </main>
</div>

<p-toast position="top-right"></p-toast>
<p-confirmDialog styleClass="admin-dialog" [breakpoints]="{ '720px': '94vw' }" [style]="{ width: '480px' }"></p-confirmDialog>
