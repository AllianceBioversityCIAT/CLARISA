<div class="glossary-admin-layout">
  <!--
    The section picker used to be a card on the left. Next to the admin sidebar
    that made two navigation columns in a row, so it is a horizontal segmented
    control above the content instead: one column, one place to switch section.
  -->
  <!--
    Un solo encabezado para la pantalla. Antes había dos títulos apilados:
    «Glossary» aquí y «Glossary terms» dentro del panel de términos, con dos
    tamaños distintos y dos explicaciones. El de dentro se fue; el texto que sí
    decía algo —qué publica el endpoint y qué pasa al desactivar— es ahora el
    apoyo de este.

    Y el selector de sección usa `admin-tabs`, el mismo control que las
    solicitudes de institución, en vez de un segmentado propio.
  -->
  <header class="admin-page">
    <div class="admin-page__head">
      <span class="admin-page__eyebrow">Manage</span>
      <h1 class="admin-page__title">Glossary</h1>
      <p class="admin-page__hint">
        Every term published by <code>GET api/glossary</code>. Deactivating a term hides it from the public glossary without deleting anything.
      </p>
    </div>

    <nav class="admin-tabs admin-page__aside" role="tablist" aria-label="Glossary sections">
      <button
        type="button"
        role="tab"
        id="glossary-tab-terms"
        class="admin-tabs__item"
        [class.is-active]="activeSection === 'terms'"
        [attr.aria-selected]="activeSection === 'terms'"
        (click)="setSection('terms')">
        <span>Terms</span>
      </button>
      <button
        type="button"
        role="tab"
        id="glossary-tab-bulk"
        class="admin-tabs__item"
        [class.is-active]="activeSection === 'bulk'"
        [attr.aria-selected]="activeSection === 'bulk'"
        (click)="setSection('bulk')">
        <span>Bulk upload</span>
      </button>
    </nav>
  </header>

  <main class="glossary-main">
    <app-glossary-terms-panel *ngIf="activeSection === 'terms'" [reloadToken]="termsReloadToken"></app-glossary-terms-panel>
    <app-glossary-bulk-panel *ngIf="activeSection === 'bulk'" (imported)="onImported()"></app-glossary-bulk-panel>
  </main>
</div>

<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
