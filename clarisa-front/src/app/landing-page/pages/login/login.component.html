<div class="login-split">
  <!--
    Brand pane. The mark is knocked out to white and left very large and very
    faint: it is texture, not a second logo, so it never competes with the bar
    above or with the form beside it.
  -->
  <aside class="brand-pane">
    <img class="brand-pane__ghost" src="../../../../assets/cgiar_logo.png" alt="" aria-hidden="true" />
    <div class="brand-pane__copy">
      <h2 class="brand-pane__title">The reference registry for One CGIAR</h2>
      <p class="brand-pane__text">Institutions, portfolios and the controlled lists that the CGIAR reporting systems rely on.</p>
    </div>
  </aside>

  <div class="form-pane">
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
      <p-panel>
        <div class="login-card">
          <header class="login-card__head">
            <p class="login-card__brand">CLARISA</p>
            <h1 class="login-card__title">Sign in</h1>
            <p class="login-card__subtitle">Request partners administrator</p>
          </header>

          <div class="field">
            <label for="login-user">Username or email</label>
            <input id="login-user" pInputText type="text" formControlName="login" name="login" autocomplete="username" />
            <small class="field__error" [hidden]="loginForm.controls['login'].valid || !loginForm.controls['login'].dirty">Login is required</small>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <!--
              El ojo va DENTRO del campo, no al lado: al lado empujaría el input
              y rompería la altura de la fila. El botón es `type="button"` a
              propósito — dentro de un formulario, un botón sin tipo envía.
            -->
            <div class="field__with-toggle">
              <input
                id="login-password"
                pInputText
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                name="password"
                autocomplete="current-password" />
              <button
                type="button"
                class="field__toggle"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showPassword"
                tabindex="0">
                <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
              </button>
            </div>
            <small class="field__error" [hidden]="loginForm.controls['password'].valid || !loginForm.controls['password'].dirty"
              >Password is required</small
            >
          </div>

          <button pButton type="submit" label="Sign in" class="login-card__submit" [disabled]="!loginForm.valid || phase !== 'idle'"></button>
        </div>
      </p-panel>
    </form>
  </div>
</div>

<!--
  La pantalla de entrada. Sustituye al `p-dialog` que tapaba medio formulario con
  una ruedecita azul.

  Dos clips encadenados sobre el mismo fondo:
    · `login-loop.mp4`  el viento mueve los cultivos dentro de las letras, en
                        bucle — empieza y acaba en el mismo fotograma, así que
                        no se ve el corte. Corre MIENTRAS el API responde.
    · `login-zoom.mp4`  el API ya contestó: la cámara entra en una letra hasta
                        que solo queda la textura, y el velo cierra a negro.

  🛑 Sobre ese negro es donde ocurre la navegación al panel, así que el cambio de
  vista no se ve (Yeck, 16-sep-2026: «combinamos ese negro para hacer la
  transición con la plataforma»).
-->
<div class="splash" *ngIf="phase !== 'idle'" [class.is-leaving]="phase === 'leaving'">
  <video class="splash__video" src="assets/video/login-loop.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <video #zoom class="splash__video splash__video--zoom" src="assets/video/login-zoom.mp4" muted playsinline aria-hidden="true"></video>

  <!-- El negro del final: es un velo, no un fotograma, para que el momento del
       corte lo decida el componente y no el vídeo. -->
  <div class="splash__black"></div>

  <div class="splash__foot">
    <div class="splash__track"><i></i></div>
    <span>Loading CLARISA</span>
  </div>
</div>
