  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

  <!-- ░░ LAYOUT ░░
       No topbar of its own: the page is embedded under the CLARISA site navbar,
       and a second bar stacked below it read as duplicated chrome. The search
       box now lives at the top of the sidebar, which is what it actually
       filters. -->
  <div class="flex">

    <!-- SIDEBAR -->
    <aside class="fixed bottom-0 left-0 top-0 z-30 w-72 overflow-y-auto border-r border-slate-200/80 bg-white px-3 py-5">
      <div class="mb-4 px-1">
        <button onclick="goHome()" class="mb-2 block w-full truncate text-left text-[13px] font-extrabold tracking-tight text-leaf-700 transition hover:text-leaf-800">
          <span id="sidebarContext">API Documentation</span>
        </button>
        <div class="relative">
          <svg class="pointer-events-none absolute left-3 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="globalSearch" type="text" placeholder="Search endpoints…  ( / )"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-[13px] outline-none transition focus:border-leaf-500 focus:bg-white focus:ring-4 focus:ring-leaf-200" />
        </div>
      </div>
      <div id="sidebar"></div>
    </aside>

    <!-- MAIN -->
    <main class="ml-72 min-h-screen min-w-0 flex-1 px-8 py-8">
      <!-- No width cap here: the data table needs the full width available.
           Prose-heavy views (home, Get Started, the Doc tab) carry their own
           `mx-auto max-w-*` so long paragraphs never go full-bleed. -->
      <div id="main" class="w-full"></div>
    </main>
  </div>

<script>
/* ════════════════════════════════════════════════════════════════════
   CLARISA API Documentation — custom proposal (no Scalar)
   Data sources:
     · catalog.json  → curated hierarchy  group > category > endpoint
     · {API}/api-docs-json → OpenAPI spec (descriptions + schemas)
     · {API}/<route> → live data, rendered as table + Excel export
   ════════════════════════════════════════════════════════════════════ */

const PARAMS = new URLSearchParams(location.search);
const API_BASE = (PARAMS.get('api') || 'http://localhost:3000/').replace(/\/?$/, '/');

/* Optional `?group=` narrows the view to a single group of the catalog, so the
   same app can back the "One CGIAR Control List" and "One CGIAR Operation"
   pages of the public menu. Matching is done on a slug, so
   `one-cgiar-operation`, `One_CGIAR_Operation` and `One CGIAR Operation` are
   all accepted. Unknown values fall back to the full catalog. */
const GROUP_PARAM = (PARAMS.get('group') || '').trim();

/* Deep link into a category or a single endpoint, so the public hierarchy
   `documentation/<group>/<category>/<endpoint>` lands where it should. */
const CATEGORY_PARAM = (PARAMS.get('category') || '').trim();
const ENDPOINT_PARAM = (PARAMS.get('endpoint') || '').trim();

const slug = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

/* URL segments use the display name with underscores for spaces, the way the
   documentation has always been linked. */
const toSegment = s => String(s ?? '').trim().replace(/\s+/g, '_');

/* Tells the Angular host which path is being shown, so the address bar keeps
   up with in-page navigation without reloading this frame. */
function announcePath(segments) {
  try {
    parent.postMessage(
      { type: 'clarisa-docs:navigate', path: segments.filter(Boolean).map(toSegment) },
      window.location.origin
    );
  } catch (e) {
    /* standalone (outside the Angular shell) — nothing to sync */
  }
}

function applyGroupFilter(catalog) {
  if (!GROUP_PARAM) return catalog;
  const wanted = slug(GROUP_PARAM);
  const groups = (catalog?.groups ?? []).filter(g => slug(g.group) === wanted);
  if (!groups.length) {
    console.warn(`[api-reference] Unknown group "${GROUP_PARAM}" — showing the whole catalog.`);
    return catalog;
  }
  return { ...catalog, groups };
}

/* Every row is painted into the DOM, so "show everything" is only safe for the
   small control lists. ~500 rows x ~20 columns is ~10k cells — a few ms of
   layout. api/institutions (~10.000 rows) is two orders of magnitude past that,
   so it keeps paginating. */
const AUTO_ALL_LIMIT = 500;    // at or below this, an endpoint opens with every record on one page
const PAGE_SIZES = [25, 50, 100, 250, 'all'];

const state = {
  catalog: null, spec: null,
  scopedGroup: null,        // group name when the view is narrowed by ?group=
  nav: 'home',              // 'home' | 'get-started' | 'endpoint' — active sidebar target
  current: null,            // { group, category, endpoint }
  rows: [], columns: [],    // flattened data of current endpoint
  filtered: [],
  sortKey: null, sortDir: 1,
  page: 1, pageSize: 25,       // pageSize is a number, or 'all' for a single page
  tab: 'table',
  cache: new Map(),
  // Query params the user typed in the JSON tab, and the response they got.
  // Empty means "no filters": the endpoint answers exactly as it always has.
  query: {},
  queryResult: null,        // { url, data } of the last query that was run
  queryLoading: false,
  queryError: null,
};

const $  = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Some values — glossary definitions above all — carry real markup in the
   database: `<br>` for line breaks, `<a href>` for references, `&bull;` for
   bullets. Printing them escaped shows the reader the tags themselves.

   These values are editable from the admin panel, so assigning them straight
   to innerHTML would let anyone who can edit a term inject markup into a page
   other people read. Instead the value is parsed into a <template>, which the
   browser builds INERT — no script runs, no image loads, no event fires — and
   then walked: only the tags below survive, everything else is flattened to
   its text. What reaches innerHTML is markup this file built, not the string
   that came from the API. */
const RICH_TAGS = new Set(['BR', 'A', 'B', 'STRONG', 'I', 'EM', 'U', 'P', 'UL', 'OL', 'LI', 'SUP', 'SUB']);

const safeHref = href => {
  const raw = String(href ?? '').trim();
  // An empty href would resolve to this very page and quietly pass the protocol
  // check below, turning every stripped link into a self-link.
  if (!raw) return null;
  try {
    // Anything whose final protocol is not http(s) — `javascript:`, `data:`,
    // `vbscript:` — is dropped and the link degrades to its text.
    const url = new URL(raw, window.location.href);
    return /^https?:$/.test(url.protocol) ? url.href : null;
  } catch { return null; }
};

const sanitizeInto = node => {
  for (const child of [...node.childNodes]) {
    if (child.nodeType === 3) continue;                       // text: always fine
    if (child.nodeType !== 1) { child.remove(); continue; }   // comments and the rest
    if (!RICH_TAGS.has(child.tagName)) {
      // Unwrap rather than delete: the words inside are content, the tag is not.
      sanitizeInto(child);
      child.replaceWith(...child.childNodes);
      continue;
    }
    // Read before stripping: the sweep below removes `href` too.
    const rawHref = child.tagName === 'A' ? child.getAttribute('href') : null;
    for (const attr of [...child.attributes]) child.removeAttribute(attr.name);
    if (child.tagName === 'A') {
      const href = safeHref(rawHref);
      if (href) {
        child.setAttribute('href', href);
        child.setAttribute('target', '_blank');
        child.setAttribute('rel', 'noopener noreferrer');
        child.className = 'font-medium text-leaf-700 underline underline-offset-2 hover:text-leaf-800';
      } else {
        // A link we cannot vouch for still keeps its text.
        child.replaceWith(...child.childNodes);
        continue;
      }
    }
    sanitizeInto(child);
  }
};

const renderRich = raw => {
  // A CSV import left doubled quotes behind in at least one definition
  // (`href=""https://…""`), which the parser reads as an empty href followed by
  // junk. Collapsing them first is what makes that link resolve at all.
  const normalised = String(raw ?? '').replace(/=""([^"]*)""/g, '="$1"');
  const tpl = document.createElement('template');
  tpl.innerHTML = normalised;
  sanitizeInto(tpl.content);
  return tpl.innerHTML;
};

const hasRichMarkup = s => /<(br|a|b|strong|i|em|u|p|ul|ol|li|sup|sub)\b[^>]*>|&[a-z]+;/i.test(String(s ?? ''));

/* ── boot ─────────────────────────────────────────────────────────── */
(async function boot() {
  try {
    // no-store: catalog and spec are tiny and must always reflect the latest
    // deploy (a cached catalog.json would show stale categories)
    const [catalog, spec] = await Promise.all([
      fetch('catalog.json', { cache: 'no-store' }).then(r => r.json()),
      fetch(API_BASE + 'api-docs-json', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
    ]);
    state.catalog = applyGroupFilter(catalog);
    state.scopedGroup = GROUP_PARAM && state.catalog.groups.length === 1 ? state.catalog.groups[0].group : null;
    state.spec = spec;
    applyScopedBranding();
    renderSidebar();
    if (!openDeepLink()) goHome();
  } catch (e) {
    $('#main').innerHTML = `<div class="rounded-2xl border border-red-200 bg-red-50 p-6 text-red-700">Could not load catalog.json — ${esc(e)}</div>`;
  }
})();

/* Opens whatever `?category=` / `?endpoint=` point at. Segments are matched
   loosely (slug), so `Institutions_List`, `institutions-list` and the plain
   display name all resolve. Returns false when there is nothing to open, or
   when the target no longer exists — the caller falls back to the home view
   instead of leaving a blank page on a stale link. */
function openDeepLink() {
  if (!CATEGORY_PARAM && !ENDPOINT_PARAM) return false;

  const groups = state.catalog.groups;

  for (let gi = 0; gi < groups.length; gi++) {
    const categories = groups[gi].categories;
    for (let ci = 0; ci < categories.length; ci++) {
      if (CATEGORY_PARAM && slug(categories[ci].name) !== slug(CATEGORY_PARAM)) continue;

      if (!ENDPOINT_PARAM) {
        openFirstOf(gi, ci);
        return true;
      }

      const ep = categories[ci].endpoints.find(
        e => slug(e.name) === slug(ENDPOINT_PARAM) || slug(e.route) === slug(ENDPOINT_PARAM)
      );
      if (ep) {
        selectEndpoint(gi, ci, ep.route);
        return true;
      }
    }
  }

  console.warn(`[api-reference] Nothing matched category="${CATEGORY_PARAM}" endpoint="${ENDPOINT_PARAM}"`);
  return false;
}

/* When the view is scoped to one group, say so in the topbar and the tab
   title instead of repeating the group name on every screen. */
function applyScopedBranding() {
  if (!state.scopedGroup) return;
  const context = $('#sidebarContext');
  if (context) context.textContent = state.scopedGroup;
  document.title = `CLARISA · ${state.scopedGroup}`;
  const search = $('#globalSearch');
  if (search) search.placeholder = `Search in ${state.scopedGroup}…  ( / )`;
}

/* ── sidebar ──────────────────────────────────────────────────────── */
function renderSidebar(filter = '') {
  const q = filter.trim().toLowerCase();
  // "Get Started" is navigation chrome, not an endpoint — always rendered first,
  // outside the endpoint search filter.
  const getStartedBtn = `
    <button id="getStartedBtn" onclick="renderGetStarted()"
      class="mb-5 flex w-full items-center gap-2.5 rounded-xl border border-leaf-200 bg-leaf-50/70 px-3 py-2.5 text-left text-[13px] font-bold text-leaf-700 transition hover:border-leaf-300 hover:bg-leaf-50">
      <svg class="h-4 w-4 shrink-0 text-leaf-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>Get Started</span>
    </button>`;
  let html = '';
  state.catalog.groups.forEach((g, gi) => {
    const cats = g.categories.map((c, ci) => {
      const eps = c.endpoints.filter(ep => !q || ep.name.toLowerCase().includes(q) || ep.route.toLowerCase().includes(q));
      if (q && !eps.length && !c.name.toLowerCase().includes(q)) return '';
      const list = (q ? eps : c.endpoints).map(ep => `
        <button onclick='selectEndpoint(${gi},${ci},${JSON.stringify(ep.route)})'
          data-route="${esc(ep.route)}"
          class="ep-btn group flex w-full items-center gap-2 rounded-lg px-3 py-[7px] text-left text-[13px] font-medium text-slate-500 transition hover:bg-leaf-50 hover:text-leaf-700">
          <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-slate-300 transition group-hover:bg-leaf-500"></span>
          <span class="truncate">${esc(ep.name)}</span>
        </button>`).join('');
      return `
        <details class="cat mb-1" ${q ? 'open' : ''} data-cat="${gi}-${ci}">
          <summary class="flex cursor-pointer select-none items-center justify-between rounded-lg px-3 py-2 text-[13px] font-semibold text-slate-700 transition hover:bg-slate-100">
            <span class="truncate">${esc(c.name)}</span>
            <span class="ml-2 shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-bold text-slate-400">${c.endpoints.length}</span>
          </summary>
          <div class="ml-2 border-l border-slate-200 pl-2 pt-1">${list}</div>
        </details>`;
    }).join('');
    if (q && !cats.trim()) return;
    // The group heading is redundant when the whole view is that group.
    const heading = state.scopedGroup
      ? ''
      : `<div class="mb-2 px-3 text-[10px] font-extrabold uppercase tracking-[0.14em] text-leaf-700/80">${esc(g.group)}</div>`;
    html += `
      <div class="mb-5">
        ${heading}
        ${cats}
      </div>`;
  });
  $('#sidebar').innerHTML = getStartedBtn + (html || '<div class="px-3 py-6 text-sm text-slate-400">No endpoints match your search.</div>');
  highlightActive();
}

function highlightActive() {
  document.querySelectorAll('.ep-btn').forEach(b => {
    const active = state.current && b.dataset.route === state.current.endpoint.route;
    b.classList.toggle('bg-leaf-50', active);
    b.classList.toggle('text-leaf-700', active);
    b.classList.toggle('font-semibold', active);
    if (active) b.closest('details')?.setAttribute('open', '');
  });
  const gs = $('#getStartedBtn');
  if (gs) {
    const on = state.nav === 'get-started';
    gs.classList.toggle('border-leaf-300', on);
    gs.classList.toggle('bg-leaf-50', on);
    gs.classList.toggle('text-leaf-800', on);
  }
}

$('#globalSearch').addEventListener('input', e => renderSidebar(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#globalSearch').focus(); }
});

/* ── home / welcome ───────────────────────────────────────────────── */
function goHome() {
  state.current = null;
  state.nav = 'home';
  announcePath([state.scopedGroup]);
  highlightActive();
  const c = state.catalog;
  const nCats = c.groups.reduce((a, g) => a + g.categories.length, 0);
  const nEps  = c.groups.reduce((a, g) => a + g.categories.reduce((b, x) => b + x.endpoints.length, 0), 0);

  // Scoped to one group: show a card per CATEGORY (with its description), since
  // repeating the group name in a single card would say nothing new.
  const cards = state.scopedGroup
    ? c.groups[0].categories.map((cat, ci) => `
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card">
          <div class="mb-1 text-[11px] font-extrabold uppercase tracking-[0.14em] text-leaf-700/80">Category</div>
          <h3 class="mb-2 text-lg font-bold text-leaf-800">${esc(cat.name)}</h3>
          ${cat.description ? `<p class="mb-4 text-[13px] leading-relaxed text-slate-500">${esc(cat.description)}</p>` : '<div class="mb-4"></div>'}
          <div class="flex flex-wrap gap-2">
            ${cat.endpoints.map(ep => `
              <button onclick='selectEndpoint(0,${ci},${JSON.stringify(ep.route)})'
                class="rounded-full border border-leaf-200 bg-leaf-50 px-3.5 py-1.5 text-xs font-semibold text-leaf-700 transition hover:border-leaf-300 hover:bg-leaf-100 hover:text-leaf-800">
                ${esc(ep.name)}
              </button>`).join('')}
          </div>
        </div>`).join('')
    : c.groups.map((g, gi) => `
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card">
          <div class="mb-1 text-[11px] font-extrabold uppercase tracking-[0.14em] text-leaf-700/80">Group</div>
          <h3 class="mb-4 text-lg font-bold text-leaf-800">${esc(g.group)}</h3>
          <div class="flex flex-wrap gap-2">
            ${g.categories.map((cat, ci) => `
              <button onclick="openFirstOf(${gi},${ci})"
                class="rounded-full border border-leaf-200 bg-leaf-50 px-3.5 py-1.5 text-xs font-semibold text-leaf-700 transition hover:border-leaf-300 hover:bg-leaf-100 hover:text-leaf-800">
                ${esc(cat.name)} <span class="opacity-50">· ${cat.endpoints.length}</span>
              </button>`).join('')}
          </div>
        </div>`).join('');

  const heroTitle = state.scopedGroup ? esc(state.scopedGroup) : "Explore CLARISA's official control lists";
  const heroDescription = state.scopedGroup ? c.groups[0].description : null;
  const stats = state.scopedGroup
    ? [[nCats, 'Categories'], [nEps, 'Endpoints']]
    : [[c.groups.length, 'Groups'], [nCats, 'Categories'], [nEps, 'Endpoints']];

  $('#main').innerHTML = `
    <div class="fade-in mx-auto max-w-6xl">
      <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-leaf-600 via-leaf-700 to-leaf-900 p-10 text-white shadow-pop">
        <div class="absolute -right-16 -top-24 h-72 w-72 rounded-full bg-leaf-300/20 blur-2xl"></div>
        <div class="absolute -bottom-28 right-32 h-64 w-64 rounded-full bg-leaf-400/25 blur-2xl"></div>
        <div class="relative">
          <div class="mb-3 inline-flex items-center gap-2 rounded-full bg-white/15 px-3 py-1 text-[11px] font-bold uppercase tracking-widest text-leaf-100">CGIAR · catalogs as a service</div>
          <h1 class="text-3xl font-extrabold tracking-tight md:text-4xl">${heroTitle}</h1>
          <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-leaf-50">
            ${heroDescription ? esc(heroDescription) + '<br class="hidden md:block" />' : ''}
            Browse every public list as a <b class="text-white">live table</b>, download it to
            <b class="text-white">Excel</b> in one click, or grab the <b class="text-white">JSON / code snippets</b>
            if you are integrating a system. Pick a category on the left to start.
          </p>
          <div class="mt-7 flex flex-wrap gap-3">
            ${stats.map(([n, l]) => `
              <div class="rounded-2xl bg-white/15 px-5 py-3 backdrop-blur">
                <div class="text-2xl font-extrabold text-white">${n}</div>
                <div class="text-[11px] font-semibold uppercase tracking-wider text-leaf-100">${l}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="mt-8 grid gap-5 lg:grid-cols-2">${cards}</div>
      <div class="mt-8 flex items-start gap-3 rounded-2xl border border-leaf-200 bg-leaf-50 p-5">
        <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-leaf-500 font-bold text-white">i</div>
        <div class="text-sm leading-relaxed text-leaf-900">
          <b>New here?</b> Every endpoint page has two faces: the <b>Table</b> tab is made for analysts and
          non-technical users (filter, sort, export to Excel); the <b>JSON, Schema and Code</b> tabs are made
          for developers integrating CLARISA into their platforms.
        </div>
      </div>
    </div>`;
}

function openFirstOf(gi, ci) {
  const ep = state.catalog.groups[gi].categories[ci].endpoints[0];
  if (ep) selectEndpoint(gi, ci, ep.route);
}

/* ── get started / authentication ─────────────────────────────────── */
function renderGetStarted() {
  state.current = null;
  state.nav = 'get-started';
  highlightActive();

  const sampleUrl = API_BASE + 'institutions';
  const curlEx = `curl -X GET "${sampleUrl}" \\\n  -H "X-API-Key: cl_prod_9f8d7e6c5b4a3b2a1c0d…" \\\n  -H "Accept: application/json"`;
  const fetchEx = `const apiKey = "cl_prod_9f8d7e6c5b4a3b2a1c0d…";\n\nconst res = await fetch("${sampleUrl}", {\n  method: "GET",\n  headers: {\n    "X-API-Key": apiKey,\n    "Accept": "application/json",\n  },\n});\nconst data = await res.json();\nconsole.log(data);`;

  const codeBlock = (title, code) => `
    <div class="mb-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3">
        <span class="text-[13px] font-bold text-leaf-800">${title}</span>
        <button onclick='copyText(${JSON.stringify(code)}, this)' class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-bold text-slate-500 transition hover:border-leaf-400 hover:text-leaf-700">Copy</button>
      </div>
      <pre class="overflow-auto bg-slate-50 p-5 font-mono text-[12.5px] leading-relaxed text-slate-700"><code>${esc(code)}</code></pre>
    </div>`;

  $('#main').innerHTML = `
    <div class="fade-in mx-auto max-w-4xl">
      <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-leaf-600 via-leaf-700 to-leaf-900 p-9 text-white shadow-pop">

        ${codeBlock('JavaScript (fetch)', fetchEx)}

}

/* ── endpoint page ────────────────────────────────────────────────── */
function specOpFor(route) {
  const p = '/' + route.replace(/^\/+/, '');
  return state.spec?.paths?.[p]?.get || null;
}

async function selectEndpoint(gi, ci, route) {
  const group = state.catalog.groups[gi];
  const category = group.categories[ci];
  const endpoint = category.endpoints.find(e => e.route === route);
  state.current = { group, category, endpoint };
  state.nav = 'endpoint';
  state.tab = 'doc'; state.page = 1; state.sortKey = null;
  // Filters belong to the endpoint that was being looked at, not to the next one.
  state.query = {}; state.queryResult = null; state.queryError = null; state.queryLoading = false;
  announcePath([group.group, category.name, endpoint?.name]);
  highlightActive();
  renderEndpointShell(true);

  try {
    let raw = state.cache.get(route);
    if (!raw) {
      raw = await fetch(API_BASE + route).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
      state.cache.set(route, raw);
    }
    const arr = Array.isArray(raw) ? raw : [raw];
    state.rows = arr.map(r => flatten(r));
    state.columns = deriveColumns(state.rows);
    state.filtered = state.rows;
    // Small catalogues (the glossary, countries, ...) open with every record on
    // one page — no pager to fight with. Big ones keep the paginated default.
    state.pageSize = state.rows.length <= AUTO_ALL_LIMIT ? 'all' : 25;
    if (state.current?.endpoint.route === route) renderEndpointShell(false);
  } catch (e) {
    if (state.current?.endpoint.route === route) renderEndpointShell(false, String(e));
  }
}

function flatten(obj, prefix = '', depth = 0, out = {}) {
  if (obj === null || typeof obj !== 'object') { out[prefix || 'value'] = obj; return out; }
  for (const [k, v] of Object.entries(obj)) {
    const key = prefix ? prefix + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v) && depth < 2) flatten(v, key, depth + 1, out);
    else if (Array.isArray(v)) out[key] = v.map(x => (x && typeof x === 'object') ? (x.name ?? x.code ?? x.acronym ?? JSON.stringify(x)) : x).join(', ');
    else out[key] = v;
  }
  return out;
}

function deriveColumns(rows) {
  const cols = [];
  const seen = new Set();
  rows.slice(0, 200).forEach(r => Object.keys(r).forEach(k => { if (!seen.has(k)) { seen.add(k); cols.push(k); } }));
  return cols;
}

function renderEndpointShell(loading, error = null) {
  const { group, category, endpoint } = state.current;
  const op = specOpFor(endpoint.route);
  const desc = op?.description || op?.summary || category.description || '';
  const inSpec = !!op;

  $('#main').innerHTML = `
    <div class="fade-in">
      <nav class="mb-3 flex items-center gap-1.5 text-xs font-semibold text-slate-400">
        <button onclick="goHome()" class="transition hover:text-leaf-700">Home</button>
        <span>/</span><span>${esc(group.group)}</span>
        <span>/</span><span class="text-leaf-700">${esc(category.name)}</span>
      </nav>

      <div class="mb-5 flex flex-wrap items-start justify-between gap-4">
        <div class="max-w-3xl">
          <h1 class="text-2xl font-extrabold tracking-tight text-leaf-800">${esc(endpoint.name)}</h1>
          ${desc ? `<p class="mt-1.5 text-[14px] leading-relaxed text-slate-500">${esc(desc)}</p>` : ''}
        </div>
        ${!inSpec && state.spec ? '<span class="rounded-full bg-amber-100 px-3 py-1 text-[11px] font-bold text-amber-700">not in public spec</span>' : ''}
      </div>

      <div class="mb-6 flex items-center gap-0 overflow-hidden rounded-2xl border border-leaf-300 bg-leaf-50 shadow-card">
        <span class="m-2 rounded-xl bg-leaf-500 px-4 py-2 font-mono text-[13px] font-bold text-white">GET</span>
        <code class="flex-1 truncate font-mono text-[13px] font-medium text-slate-700">${esc(API_BASE + endpoint.route)}</code>
        <button onclick="copyText('${esc(API_BASE + endpoint.route)}', this)"
          class="m-2 rounded-xl border border-leaf-300 bg-white px-3.5 py-2 text-xs font-bold text-leaf-700 transition hover:bg-leaf-100">Copy</button>
        <a href="${esc(API_BASE + endpoint.route)}" target="_blank"
          class="m-2 ml-0 rounded-xl border border-leaf-300 bg-white px-3.5 py-2 text-xs font-bold text-leaf-700 transition hover:bg-leaf-100">Open ↗</a>
      </div>

      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex rounded-xl border border-slate-200 bg-white p-1 shadow-card">
          ${['doc:Doc','table:Table','json:JSON','schema:Schema','code:Code'].map(t => {
            const [id, label] = t.split(':');
            const on = state.tab === id;
            return `<button onclick="setTab('${id}')"
              class="rounded-lg px-4 py-1.5 text-[13px] font-semibold transition ${on ? 'bg-leaf-700 text-white shadow' : 'text-slate-500 hover:text-leaf-700'}">${label}</button>`;
          }).join('')}
        </div>
        <div class="flex items-center gap-2" id="exportZone"></div>
      </div>

      <div id="tabBody"></div>
    </div>`;

  // Doc and Code are spec/static-derived — render them immediately, no wait for live data.
  if (loading && (state.tab === 'doc' || state.tab === 'code')) { renderTab(); return; }
  if (loading) {
    $('#tabBody').innerHTML = `
      <div class="rounded-2xl border border-slate-200 bg-white p-16 text-center shadow-card">
        <svg class="spin mx-auto h-8 w-8 text-leaf-700" fill="none" viewBox="0 0 24 24"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
        <div class="mt-4 text-sm font-semibold text-slate-500">Fetching live data…</div>
        <div class="mt-1 text-xs text-slate-400">Large lists (e.g. Institutions) can take a few seconds.</div>
      </div>`;
    return;
  }
  if (error) {
    $('#tabBody').innerHTML = `
      <div class="rounded-2xl border border-red-200 bg-red-50 p-8 text-center">
        <div class="text-sm font-bold text-red-700">Could not load this endpoint</div>
        <div class="mt-1 font-mono text-xs text-red-500">${esc(error)}</div>
        <button onclick='selectEndpointRetry()' class="mt-4 rounded-xl bg-red-600 px-4 py-2 text-xs font-bold text-white hover:bg-red-700">Retry</button>
      </div>`;
    return;
  }
  renderTab();
}

function selectEndpointRetry() {
  const { group, category, endpoint } = state.current;
  const gi = state.catalog.groups.indexOf(group), ci = group.categories.indexOf(category);
  state.cache.delete(endpoint.route);
  selectEndpoint(gi, ci, endpoint.route);
}

function setTab(t) { state.tab = t; renderEndpointShell(false); }

/* ── tabs ─────────────────────────────────────────────────────────── */
function renderTab() {
  const zone = $('#exportZone');
  zone.innerHTML = '';
  if (state.tab === 'table') {
    zone.innerHTML = `
      <span class="mr-1 rounded-full bg-leaf-50 px-3 py-1.5 text-xs font-bold text-leaf-700">${state.filtered.length.toLocaleString()} records</span>
      <button onclick="exportExcel()" class="flex items-center gap-1.5 rounded-xl bg-leaf-500 px-4 py-2 text-xs font-bold text-white shadow-card transition hover:bg-leaf-600">
        <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v8.6l2.3-2.3a1 1 0 111.4 1.4l-4 4a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L9 11.6V3a1 1 0 011-1z"/><path d="M3 15a1 1 0 011 1v1h12v-1a1 1 0 112 0v2a1 1 0 01-1 1H3a1 1 0 01-1-1v-2a1 1 0 011-1z"/></svg>
        Excel</button>
      <button onclick="exportCSV()" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-bold text-slate-600 transition hover:border-leaf-400 hover:text-leaf-700">CSV</button>
      <button onclick="exportJSON()" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-bold text-slate-600 transition hover:border-leaf-400 hover:text-leaf-700">JSON</button>`;
  }
  if (state.tab === 'doc')    return renderDoc();
  if (state.tab === 'table')  return renderTable();
  if (state.tab === 'json')   return renderJSON();
  if (state.tab === 'schema') return renderSchema();
  if (state.tab === 'code')   return renderCode();
}

/* ── TABLE tab ────────────────────────────────────────────────────── */
function renderTable() {
  const total = state.filtered.length;
  const showingAll = state.pageSize === 'all';
  const size = showingAll ? Math.max(total, 1) : state.pageSize;
  const pages = Math.max(1, Math.ceil(total / size));
  state.page = Math.min(state.page, pages);
  const start = (state.page - 1) * size;
  const rows = state.filtered.slice(start, start + size);

  const ths = state.columns.map(c => {
    const on = state.sortKey === c;
    return `<th onclick="sortBy('${esc(c)}')"
      class="cursor-pointer select-none whitespace-nowrap border-b border-slate-200 bg-leaf-700 px-4 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white transition hover:bg-leaf-700">
      ${esc(c)} <span class="${on ? 'text-leaf-300' : 'text-leaf-400/50'}">${on ? (state.sortDir > 0 ? '▲' : '▼') : '↕'}</span></th>`;
  }).join('');

  const trs = rows.map((r, i) => `
    <tr class="${i % 2 ? 'bg-slate-50/60' : 'bg-white'} transition hover:bg-leaf-50">
      ${state.columns.map(c => {
        let v = r[c];
        if (v === null || v === undefined || v === '') return '<td class="border-b border-slate-100 px-4 py-2.5 text-slate-300">—</td>';
        if (typeof v === 'boolean') return `<td class="border-b border-slate-100 px-4 py-2.5">${v ? '<span class="font-bold text-leaf-600">✓ yes</span>' : '<span class="font-semibold text-slate-400">✗ no</span>'}</td>`;
        v = String(v);
        // Full value, always: a definition is the content here, not a preview of
        // it. Prose wraps into a paragraph capped by the inner div (max-width on
        // a <td> is ignored by the auto table layout, on a block child it is
        // not). Short values keep `whitespace-nowrap` on purpose: if every cell
        // may wrap, an over-wide table collapses to its min-content width and
        // turns ordinary names into one-word-per-line columns. No `title`
        // attribute any more — the text is fully visible, so a tooltip
        // repeating it is just noise.
        // A value carrying markup always takes the wrapping branch: a line
        // break inside `whitespace-nowrap` would render as nothing at all.
        return v.length > 45 || hasRichMarkup(v)
          ? `<td class="border-b border-slate-100 px-4 py-2.5 text-[13px] leading-relaxed text-slate-600"><div class="max-w-[560px] whitespace-normal break-words">${renderRich(v)}</div></td>`
          : `<td class="whitespace-nowrap border-b border-slate-100 px-4 py-2.5 text-[13px] text-slate-600">${esc(v)}</td>`;
      }).join('')}
    </tr>`).join('');

  $('#tabBody').innerHTML = `
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
      <div class="flex flex-wrap items-center gap-3 border-b border-slate-100 px-4 py-3">
        <div class="relative flex-1 min-w-[220px] max-w-sm">
          <svg class="absolute left-3 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="tableSearch" type="text" placeholder="Filter ${state.rows.length.toLocaleString()} records…"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-[13px] outline-none transition focus:border-leaf-500 focus:bg-white focus:ring-4 focus:ring-leaf-200" />
        </div>
        <div class="ml-auto flex items-center gap-2 text-xs font-semibold text-slate-400">
          Rows
          <select id="pageSize" class="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs font-bold text-slate-600 outline-none">
            ${PAGE_SIZES.filter(n => n !== 'all' || state.rows.length <= AUTO_ALL_LIMIT).map(n => `<option value="${n}" ${String(n) === String(state.pageSize) ? 'selected' : ''}>${n === 'all' ? 'All' : n}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="max-h-[58vh] overflow-auto">
        <table class="data w-full border-collapse text-sm"><thead><tr>${ths}</tr></thead><tbody>${trs ||
          `<tr><td colspan="${state.columns.length}" class="px-4 py-12 text-center text-sm text-slate-400">No records match your filter.</td></tr>`}</tbody></table>
      </div>
      <div class="flex items-center justify-between border-t border-slate-100 px-4 py-3 text-xs font-semibold text-slate-500">
        <span>${showingAll
          ? `Showing <b class="text-leaf-700">all ${total.toLocaleString()}</b> record${total === 1 ? '' : 's'}`
          : `Showing <b class="text-leaf-700">${total ? (start + 1).toLocaleString() : 0}–${Math.min(start + size, total).toLocaleString()}</b> of <b class="text-leaf-700">${total.toLocaleString()}</b>`}</span>
        ${showingAll ? '' : `
        <div class="flex items-center gap-1.5">
          <button onclick="setPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''} class="rounded-lg border border-slate-200 px-3 py-1.5 transition enabled:hover:border-leaf-400 enabled:hover:text-leaf-700 disabled:opacity-40">← Prev</button>
          <span class="px-2">Page <b class="text-leaf-700">${state.page}</b> / ${pages.toLocaleString()}</span>
          <button onclick="setPage(${state.page + 1})" ${state.page >= pages ? 'disabled' : ''} class="rounded-lg border border-slate-200 px-3 py-1.5 transition enabled:hover:border-leaf-400 enabled:hover:text-leaf-700 disabled:opacity-40">Next →</button>
        </div>`}
      </div>
    </div>`;

  let deb;
  $('#tableSearch').addEventListener('input', e => {
    clearTimeout(deb);
    deb = setTimeout(() => {
      const q = e.target.value.trim().toLowerCase();
      state.filtered = !q ? state.rows : state.rows.filter(r => state.columns.some(c => String(r[c] ?? '').toLowerCase().includes(q)));
      state.page = 1;
      applySort(false);
      renderTab();
      const inp = $('#tableSearch'); inp.value = e.target.value; inp.focus(); inp.setSelectionRange(q.length + 99, q.length + 99);
    }, 250);
  });
  $('#pageSize').addEventListener('change', e => { state.pageSize = e.target.value === 'all' ? 'all' : +e.target.value; state.page = 1; renderTable(); });
}

function setPage(p) { state.page = p; renderTable(); }

function sortBy(col) {
  if (state.sortKey === col) state.sortDir *= -1; else { state.sortKey = col; state.sortDir = 1; }
  applySort(true);
}
function applySort(rerender) {
  if (state.sortKey) {
    const k = state.sortKey, d = state.sortDir;
    state.filtered = [...state.filtered].sort((a, b) => {
      const x = a[k], y = b[k];
      if (x == null) return 1; if (y == null) return -1;
      const nx = parseFloat(x), ny = parseFloat(y);
      if (!isNaN(nx) && !isNaN(ny) && String(nx) == String(x).trim() && String(ny) == String(y).trim()) return (nx - ny) * d;
      return String(x).localeCompare(String(y)) * d;
    });
  }
  if (rerender) renderTable();
}

/* ── query params ─────────────────────────────────────────────────────
   The filters an endpoint accepts, read from the OpenAPI spec and shared by
   the Doc tab (which documents them) and the JSON tab (which runs them).
   `version` is not published as a parameter by Nest, so it is appended for the
   endpoints that do serve a v2. */
function queryParamsFor(route) {
  const op = specOpFor(route);
  const params = (op?.parameters || []).filter(p => p.in === 'query').map(p => {
    const schema = p.schema || {};
    return {
      name: p.name,
      required: !!p.required,
      description: p.description || '',
      values: Array.isArray(schema.enum) ? schema.enum : null,
      type: tsType(schema),
      isNumber: schema.type === 'number' || schema.type === 'integer',
      default: schema.default !== undefined ? String(schema.default) : '',
    };
  });

  const baseRoute = route.replace(/^api\//, '').replace(/^\/+/, '');
  if (V2_ENDPOINTS[baseRoute] && !params.some(p => p.name === 'version')) {
    params.push({
      name: 'version',
      required: false,
      description: 'Response version. Omit it and you get v1.',
      values: ['1', '2'],
      type: '"1" | "2"',
      isNumber: false,
      default: '1',
    });
  }
  return params;
}

/** The filters currently filled in, as `name=value` pairs. */
function activeQueryPairs() {
  return Object.entries(state.query).filter(([, v]) => v !== '' && v !== null && v !== undefined);
}

function buildQueryUrl() {
  const pairs = activeQueryPairs();
  const qs = pairs.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
  return API_BASE + state.current.endpoint.route + (qs ? '?' + qs : '');
}

/* Updates the state and only repaints the URL preview: repainting the whole
   panel on every keystroke would steal the focus from the field being typed. */
function setQueryValue(name, value) {
  if (value === '' || value === null) delete state.query[name];
  else state.query[name] = value;

  const preview = $('#queryUrl');
  if (preview) preview.textContent = buildQueryUrl();
  const runBtn = $('#queryRun');
  if (runBtn) runBtn.disabled = false;
}

async function runQuery() {
  const url = buildQueryUrl();
  state.queryLoading = true; state.queryError = null;
  renderJSON();
  try {
    const data = await fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    state.queryResult = { url, data };
  } catch (e) {
    state.queryResult = null;
    state.queryError = String(e);
  }
  state.queryLoading = false;
  renderJSON();
}

function resetQuery() {
  state.query = {}; state.queryResult = null; state.queryError = null;
  renderJSON();
}

/** What the JSON tab is showing: the filtered response when one was run, the
    plain endpoint response otherwise. */
function currentJsonData() {
  return state.queryResult ? state.queryResult.data : state.cache.get(state.current.endpoint.route);
}

/* ── JSON tab ─────────────────────────────────────────────────────── */
function renderJSON() {
  const params = queryParamsFor(state.current.endpoint.route);
  const raw = currentJsonData();
  const arr = Array.isArray(raw) ? raw : [raw];
  const preview = arr.slice(0, 50);
  const filtered = !!state.queryResult;

  const label = filtered
    ? `Filtered response · ${esc(state.queryResult.url.split('?')[1] || 'no filters')} · showing first ${preview.length.toLocaleString()} of ${arr.length.toLocaleString()} items`

  $('#tabBody').innerHTML = `

    </div>`;
}

function resolveRef(node) {
  if (node?.$ref) {
    const name = node.$ref.split('/').pop();
    return state.spec?.components?.schemas?.[name] || {};
  }
  return node || {};
}
function renderSchema() {
  const op = specOpFor(state.current.endpoint.route);
  let schema = op?.responses?.['200']?.content?.['application/json']?.schema;
  schema = resolveRef(schema);
  if (schema.type === 'array') schema = resolveRef(schema.items);
  const props = schema.properties;

  if (!props) {
    const sample = state.rows[0] || {};
    $('#tabBody').innerHTML = schemaTable(Object.keys(sample).map(k => [k, { type: typeof sample[k] }]), true);
    return;
  }
  const required = new Set(schema.required || []);
  $('#tabBody').innerHTML = schemaTable(Object.entries(props).map(([k, v]) => [k, resolveRef(v), required.has(k)]), false);
}
function schemaTable(entries, inferred) {
  const rows = entries.map(([name, def, req]) => `
    <tr class="bg-white transition hover:bg-leaf-50/60">
      <td class="border-b border-slate-100 px-5 py-3 font-mono text-[13px] font-semibold text-leaf-700">${esc(name)} ${req ? '<span class="ml-1 rounded bg-red-50 px-1.5 py-0.5 text-[10px] font-bold text-red-500">required</span>' : ''}</td>
      <td class="border-b border-slate-100 px-5 py-3"><span class="rounded-md bg-leaf-100 px-2 py-1 font-mono text-[11px] font-bold text-leaf-800">${esc(def.type || 'object')}${def.format ? ` · ${esc(def.format)}` : ''}</span></td>
      <td class="border-b border-slate-100 px-5 py-3 text-[13px] text-slate-500">${esc(def.description || '')}</td>
    </tr>`).join('');
  return `
    ${inferred ? '<div class="mb-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-2.5 text-xs font-semibold text-amber-700">Schema not published in the OpenAPI spec — fields inferred from live data.</div>' : ''}
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
      <table class="w-full border-collapse text-sm">
        <thead><tr>
          <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Field</th>
          <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Type</th>
          <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Description</th>

}

/* ── DOC tab ──────────────────────────────────────────────────────── */
/* Endpoints that expose a v2 via the ?version=2 query param (the rest serve v1).
   Mirrors the @Version(...) decorators in the NestJS controllers. */
const V2_ENDPOINTS = {
  'cgiar-entities':        'Returns the richer <code class="docpill">CgiarEntityDtoV2</code> shape (entity type, lineages, portfolio, dates) and adds the <code class="docpill">portfolioId</code> and <code class="docpill">year</code> filters.',
  'cgiar-entity-typology': 'Returns the v2 typology shape.',
  'sdgs':                  'Declared <code class="docpill">@Version([\'1\',\'2\'])</code> — responds identically for v1 and v2.',
  'sdg-targets':           'Returns the v2 target shape.',
  'sdg-indicators':        'Returns the v2 indicator shape.',
};

function tsType(node) {
  if (!node) return 'any';
  if (node.$ref) return node.$ref.split('/').pop();
  if (node.type === 'array') {
    const it = node.items || {};
    const inner = it.$ref ? it.$ref.split('/').pop() : tsType(it);
    return inner + '[]';
  }
  if (Array.isArray(node.enum)) return node.enum.map(e => JSON.stringify(e)).join(' | ');
  const t = node.type;
  if (t === 'integer' || t === 'number') return 'number';
  if (t === 'boolean') return 'boolean';
  if (t === 'string') return 'string';
  if (t === 'object') return 'object';
  return t || 'any';
}

function docCodeBlock(title, code) {
  return `

      </div>

    </div>`;
}

function docSection(title, subtitle, bodyHtml) {

}

function renderDoc() {
  const route = state.current.endpoint.route;            // e.g. "api/cgiar-entities"
  const baseRoute = route.replace(/^api\//, '').replace(/^\/+/, '');
  const url = API_BASE + route;
  const op = specOpFor(route);

  /* ── 1. Versioning ── */
  const v2 = V2_ENDPOINTS[baseRoute];
  let versioningBody;
  if (v2) {
    const vEx = `# v1 — default, no param needed\nGET ${url}\n\n# v2 — opt in with the version query param\nGET ${url}?version=2`;

  let paramsBody;
  if (qParams.length) {
    const rows = qParams.map(p => {
      const values = p.values
        ? `<div class="mt-1.5 flex flex-wrap gap-1">${p.values.map(v => `<code class="docpill">${esc(v)}</code>`).join('')}</div>`
        : '';
      return `
        <tr class="bg-white transition hover:bg-leaf-50/60">
          <td class="border-b border-slate-100 px-5 py-3 align-top font-mono text-[13px] font-semibold text-leaf-700">${esc(p.name)}
            ${p.required
              ? '<span class="ml-1 rounded bg-red-50 px-1.5 py-0.5 text-[10px] font-bold text-red-500">required</span>'
              : '<span class="ml-1 rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold text-slate-400">optional</span>'}</td>
          <td class="border-b border-slate-100 px-5 py-3 align-top"><span class="rounded-md bg-leaf-100 px-2 py-1 font-mono text-[11px] font-bold text-leaf-800">${esc(p.values ? 'enum' : p.type)}</span>${values}</td>
          <td class="border-b border-slate-100 px-5 py-3 align-top font-mono text-[12px] text-slate-500">${p.default ? esc(p.default) : '<span class="text-slate-300">—</span>'}</td>
          <td class="border-b border-slate-100 px-5 py-3 align-top text-[13px] text-slate-500">${esc(p.description) || '<span class="text-slate-300">Not documented in the spec.</span>'}</td>
        </tr>`;
    }).join('');

    /* One ready-made request per value of every enum filter — the answer to
       "how do I get only the active ones?" should be a line you can copy, not
       a table you have to interpret. */
    const recipes = [];
    qParams.filter(p => p.values).forEach(p => {
      p.values.forEach(v => recipes.push(`# ${p.name} = ${v}\nGET ${url}?${p.name}=${v}`));
    });
    /* Only enums go into the combined example: their values are real, while
       inventing a number for a cursor teaches the wrong thing. */
    const combo = qParams.filter(p => p.values).slice(0, 2)
      .map(p => `${p.name}=${p.values[p.values.length - 1]}`);
    if (combo.length > 1) recipes.push(`# combined — filters stack with &\nGET ${url}?${combo.join('&')}`);
    if (!recipes.length) recipes.push(`# every parameter is optional\nGET ${url}`);

    paramsBody = `

      ${docCodeBlock('Ready-made requests', recipes.join('\n\n'))}`;
  } else {
    const fallback = v2 ? `?version=2` : '';
    paramsBody = `
      <div class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-[13.5px] leading-relaxed text-slate-600">
        No query parameters are published for this endpoint in the OpenAPI spec.${v2 ? ` You can still pass <code class="docpill">?version=2</code> to opt into v2.` : ''}
      </div>${fallback ? docCodeBlock('Example', `GET ${url}${fallback}`) : ''}`;
  }
  const params = docSection('Query parameters', 'Optional filters you append to the request URL to narrow what comes back.', paramsBody);

  /* ── 3. Responses / status codes ── */
  const responses = op?.responses || {};
  let respBody;
  const respKeys = Object.keys(responses);
  if (respKeys.length) {
    respBody = `
      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
        <table class="w-full border-collapse text-sm">
          <thead><tr>
            <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Status</th>
            <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Meaning</th>
          </tr></thead>
          <tbody>${respKeys.map(code => {
            const ok = code.startsWith('2');
            return `<tr class="bg-white">
              <td class="border-b border-slate-100 px-5 py-3"><span class="rounded-md px-2 py-1 font-mono text-[12px] font-bold ${ok ? 'bg-leaf-100 text-leaf-800' : 'bg-amber-100 text-amber-700'}">${esc(code)}</span></td>
              <td class="border-b border-slate-100 px-5 py-3 text-[13px] text-slate-600">${esc(responses[code].description || (ok ? 'Successful response' : ''))}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
  } else {
    respBody = `
      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
        <table class="w-full border-collapse text-sm">
          <thead><tr>
            <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Status</th>
            <th class="border-b border-slate-200 bg-leaf-700 px-5 py-3 text-left text-[11px] font-bold uppercase tracking-wider text-white">Meaning</th>
          </tr></thead>
          <tbody>
            <tr class="bg-white"><td class="border-b border-slate-100 px-5 py-3"><span class="rounded-md bg-leaf-100 px-2 py-1 font-mono text-[12px] font-bold text-leaf-800">200</span></td><td class="border-b border-slate-100 px-5 py-3 text-[13px] text-slate-600">Successful response — returns the control list.</td></tr>
            <tr class="bg-white"><td class="border-b border-slate-100 px-5 py-3"><span class="rounded-md bg-amber-100 px-2 py-1 font-mono text-[12px] font-bold text-amber-700">401</span></td><td class="border-b border-slate-100 px-5 py-3 text-[13px] text-slate-600">Missing or invalid API token.</td></tr>
          </tbody>

  }
  const respSection = docSection('Responses', 'HTTP status codes this endpoint can return.', respBody);

  /* ── 4. Response model / DTO interface ── */
  let schemaNode = op?.responses?.['200']?.content?.['application/json']?.schema;
  let returnsArray = false;
  if (schemaNode?.type === 'array') { returnsArray = true; schemaNode = schemaNode.items; }
  const modelName = schemaNode?.$ref ? schemaNode.$ref.split('/').pop() : (resolveRef(schemaNode).title || 'Response');
  const model = resolveRef(schemaNode);
  const props = model.properties;
  let dtoBody;
  if (props) {
    const required = new Set(model.required || []);
    const lines = Object.entries(props).map(([k, v]) => {
      const optional = required.has(k) ? '' : '?';
      const t = tsType(v);
      const desc = (resolveRef(v).description || v.description || '').replace(/\s+/g, ' ').trim();
      return `  ${k}${optional}: ${t};${desc ? '  // ' + desc : ''}`;
    });
    const iface = `interface ${modelName} {\n${lines.join('\n')}\n}`;
    const returnLine = `// GET ${route} → ${returnsArray ? modelName + '[]' : modelName}`;
    dtoBody = docCodeBlock(`${modelName}${returnsArray ? '[]' : ''}`, `${returnLine}\n\n${iface}`);
  } else {
    const sample = state.rows && state.rows[0];
    if (sample) {
      const lines = Object.keys(sample).map(k => `  ${k}: ${typeof sample[k] === 'number' ? 'number' : typeof sample[k] === 'boolean' ? 'boolean' : 'string'};`);
      dtoBody = `<div class="mb-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-2.5 text-xs font-semibold text-amber-700">Model not published in the OpenAPI spec — shape inferred from live data.</div>${docCodeBlock('Inferred shape', `interface ${modelName} {\n${lines.join('\n')}\n}`)}`;

    }
  }
  const dtoSection = docSection('Response model', 'The DTO returned in the response body.', dtoBody);

  $('#tabBody').innerHTML = `<div class="mx-auto max-w-4xl">${versioning}${params}${respSection}${dtoSection}</div>`;
}

  // From the JSON tab you download what you are looking at, filters included;
  // from the Table tab, the plain response that feeds the table.
  const raw = state.tab === 'json' ? currentJsonData() : state.cache.get(state.current.endpoint.route);
  download(new Blob([JSON.stringify(raw, null, 2)], { type: 'application/json' }), exportName('json'));
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ── misc ─────────────────────────────────────────────────────────── */
function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(() => {
    const old = btn.textContent; btn.textContent = 'Copied ✓';
    setTimeout(() => (btn.textContent = old), 1400);
  });
}
</script>
