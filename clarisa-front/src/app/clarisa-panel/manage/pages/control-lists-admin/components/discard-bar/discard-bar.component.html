<div class="bar" role="group" aria-labelledby="cl-discard-title">
  <p class="bar__text">
    <strong id="cl-discard-title">Discard your changes?</strong>
    <span>It will not be saved.</span>
  </p>
  <div class="bar__actions">
    <button #keepButton pButton type="button" label="Keep editing" class="btn-brand p-button-sm" (click)="keepEditing()"></button>
    <button pButton type="button" label="Discard" class="btn-caution p-button-sm" (click)="discard.emit()"></button>
  </div>
</div>
