<p-dialog
  header="Publish list"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saving"
  [style]="{ width: '36rem' }"
  [breakpoints]="{ '720px': '94vw' }"
  styleClass="admin-dialog">
  <form class="admin-form" (ngSubmit)="submit()">
    <p class="cl-lead" *ngIf="list">
      Publishing <strong>{{ list.name }}</strong> creates its table and makes the list public at:
    </p>
    <code class="cl-address cl-address--block">{{ address }}</code>
    <p class="field-hint cl-gap">
      From then on you can add records, and any system can read them. You can still add, rename and remove fields afterwards. A published list cannot
      be unpublished, only deleted.
    </p>

    <p class="field-error cl-error" role="alert" *ngIf="error"><i class="pi pi-times-circle" aria-hidden="true"></i> {{ error }}</p>

    <div class="admin-form__actions">
      <button pButton type="button" label="Cancel" class="btn-ghost" autofocus [disabled]="saving" (click)="close()"></button>
      <button
        pButton
        type="submit"
        [label]="saving ? 'Publishing…' : 'Publish list'"
        class="btn-brand"
        [loading]="saving"
        [disabled]="saving"></button>
    </div>
  </form>
</p-dialog>
