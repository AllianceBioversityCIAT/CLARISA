<!--
  Sin sidebar propio: las tres pestañas se eligen desde el menú negro del
  panel («Manage > System > Microservices & API keys»), que ahora las lleva
  desplegadas. Esto ocupa el ancho entero.
-->
<main class="ms-admin-main">
  <app-api-keys-panel *ngIf="activeSection === 'api-keys'"></app-api-keys-panel>
  <app-api-key-usage-dashboard *ngIf="activeSection === 'usage'"></app-api-key-usage-dashboard>
  <app-mises-panel *ngIf="activeSection === 'mises'"></app-mises-panel>
</main>

<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
